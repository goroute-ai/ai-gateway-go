openapi: 3.1.0
info:
  title: Agent2Agent (A2A) Protocol Specification API
  version: 1.0.0
  summary: Complete Linux Foundation Agent2Agent (A2A) v1.0 Protocol OpenAPI Specification
  description: |
    Authoritative OpenAPI 3.1.0 specification for the **Agent2Agent (A2A) Protocol v1.0**,
    derived directly from the upstream `a2aproject/A2A` normative Protobuf contract
    (`specification/a2a.proto`, commit `5f931b8`) and protocol specification (`docs/specification.md`).

    ### Covered Protocol Layers & Bindings
    - **Agent Discovery**: RFC 8615 well-known manifest (`GET /.well-known/agent-card.json`) with RFC 8785 JCS canonicalization and RFC 7515 JWS (`AgentCardSignature`).
    - **HTTP+JSON / REST Binding**: All 11 A2A v1.0 operations on both root (`/message:send`, `/tasks/{id}`, ...) and multi-tenant (`/{tenant}/message:send`, `/{tenant}/tasks/{id}`, ...) paths, using `application/a2a+json` (and `application/json` compatibility), `A2A-Version` / `A2A-Extensions` headers, `text/event-stream` SSE streaming, and `google.rpc.Status` + `google.rpc.ErrorInfo` error envelopes.
    - **JSON-RPC 2.0 Binding**: Single-endpoint `POST /` (and `POST /{tenant}`) supporting all 11 canonical PascalCase A2A v1.0 JSON-RPC methods (`SendMessage`, `SendStreamingMessage`, `GetTask`, `ListTasks`, `CancelTask`, `SubscribeToTask`, `CreateTaskPushNotificationConfig`, `GetTaskPushNotificationConfig`, `ListTaskPushNotificationConfigs`, `DeleteTaskPushNotificationConfig`, `GetExtendedAgentCard`) and A2A JSON-RPC error codes (`-32001` through `-32009`).
    - **Push Notification Webhooks**: Server-initiated HTTP `POST` callbacks delivering `StreamResponse` payloads with `Content-Type: application/a2a+json` and configured authentication headers.
    - **Canonical ProtoJSON Data Model**: 1:1 camelCase ProtoJSON schemas for all 44 messages and 2 enums (`SCREAMING_SNAKE_CASE`) defined in `lf.a2a.v1`.

    > **Note on `SubscribeToTask` HTTP Method**: `specification/a2a.proto` binds `SubscribeToTask` to `GET /tasks/{id}:subscribe`, while `docs/specification.md` (Sections 5.3 and 11.3.2) lists `POST /tasks/{id}:subscribe`. Both `GET` and `POST` are documented here for full interoperability.
  contact:
    name: Agent2Agent (A2A) Protocol Working Group
    url: https://a2a-protocol.org/latest/specification/
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

externalDocs:
  description: Official A2A Protocol Specification (a2aproject/A2A)
  url: https://github.com/a2aproject/A2A/blob/main/docs/specification.md

servers:
  - url: https://agent.example.com
    description: A2A Agent Endpoint (Production HTTPS)
  - url: http://localhost:8080
    description: Local Development Endpoint

tags:
  - name: Discovery
    description: Public and authenticated extended Agent Card discovery endpoints.
  - name: Messaging
    description: Synchronous and streaming message exchange operations (`SendMessage`, `SendStreamingMessage`).
  - name: Tasks
    description: Task retrieval, listing, cancellation, and live SSE event subscription operations.
  - name: Push Notifications
    description: CRUD operations for asynchronous task webhook push notification configurations.
  - name: JSON-RPC 2.0
    description: JSON-RPC 2.0 over HTTP(S) transport binding supporting all 11 A2A v1.0 operations.

paths:
  # ===========================================================================
  # Agent Discovery (RFC 8615)
  # ===========================================================================
  /.well-known/agent-card.json:
    get:
      tags: [Discovery]
      summary: Get Well-Known Agent Card
      description: |
        Returns the public self-describing `AgentCard` manifest for the agent at the
        RFC 8615 well-known URI. May include RFC 7515 JWS cryptographic signatures
        computed over the RFC 8785 (JCS) canonicalized Agent Card payload.
      operationId: getWellKnownAgentCard
      security: []
      responses:
        '200':
          description: Public Agent Card manifest.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentCard'
            application/a2a+json:
              schema:
                $ref: '#/components/schemas/AgentCard'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ===========================================================================
  # JSON-RPC 2.0 Transport Binding
  # ===========================================================================
  /:
    post:
      tags: [JSON-RPC 2.0]
      summary: Dispatch A2A JSON-RPC 2.0 Request
      description: |
        Single-endpoint JSON-RPC 2.0 transport binding over HTTP(S).
        Supports all 11 canonical PascalCase A2A v1.0 methods:
        `SendMessage`, `SendStreamingMessage`, `GetTask`, `ListTasks`, `CancelTask`,
        `SubscribeToTask`, `CreateTaskPushNotificationConfig`, `GetTaskPushNotificationConfig`,
        `ListTaskPushNotificationConfigs`, `DeleteTaskPushNotificationConfig`, and
        `GetExtendedAgentCard`.

        - Application-level errors return HTTP `200 OK` with a JSON-RPC `error` object (`-32001`..-`32009`, `-32700`, `-32600`..`-32603`).
        - Transport-level authentication/authorization failures return HTTP `401` / `403`.
        - Streaming methods (`SendStreamingMessage`, `SubscribeToTask`) return `text/event-stream` SSE frames containing JSON-RPC `StreamResponse` envelopes.
      operationId: dispatchJsonRpc
      parameters:
        - $ref: '#/components/parameters/A2AVersionHeader'
        - $ref: '#/components/parameters/A2AExtensionsHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JSONRPCRequest'
          application/a2a+json:
            schema:
              $ref: '#/components/schemas/JSONRPCRequest'
      responses:
        '200':
          description: |
            JSON-RPC 2.0 response envelope (result or protocol error), or an SSE stream
            for `SendStreamingMessage` and `SubscribeToTask`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONRPCResponse'
            application/a2a+json:
              schema:
                $ref: '#/components/schemas/JSONRPCResponse'
            text/event-stream:
              schema:
                type: string
                description: |
                  Server-Sent Events stream where each `data:` line contains a JSON-RPC 2.0
                  response object whose `result` is a `StreamResponse` (or `error` on failure).
                example: |
                  data: {"jsonrpc":"2.0","id":1,"result":{"task":{"id":"task-123","contextId":"ctx-456","status":{"state":"TASK_STATE_WORKING"}}}}

                  data: {"jsonrpc":"2.0","id":1,"result":{"statusUpdate":{"taskId":"task-123","contextId":"ctx-456","status":{"state":"TASK_STATE_COMPLETED"}}}}
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '415':
          $ref: '#/components/responses/UnsupportedMediaTypeError'

  /{tenant}:
    post:
      tags: [JSON-RPC 2.0]
      summary: Dispatch Tenant-Scoped A2A JSON-RPC 2.0 Request
      description: Tenant-routed equivalent of `POST /` for multi-tenant A2A JSON-RPC 2.0 endpoints.
      operationId: dispatchTenantJsonRpc
      parameters:
        - $ref: '#/components/parameters/TenantPathParam'
        - $ref: '#/components/parameters/A2AVersionHeader'
        - $ref: '#/components/parameters/A2AExtensionsHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JSONRPCRequest'
          application/a2a+json:
            schema:
              $ref: '#/components/schemas/JSONRPCRequest'
      responses:
        '200':
          description: JSON-RPC 2.0 response envelope or SSE stream for streaming methods.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONRPCResponse'
            application/a2a+json:
              schema:
                $ref: '#/components/schemas/JSONRPCResponse'
            text/event-stream:
              schema:
                type: string
                description: Server-Sent Events stream of JSON-RPC `StreamResponse` envelopes.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '415':
          $ref: '#/components/responses/UnsupportedMediaTypeError'

  # ===========================================================================
  # HTTP+JSON / REST Binding — Message Operations
  # ===========================================================================
  /message:send:
    post:
      tags: [Messaging]
      summary: Send Message
      description: |
        Sends a message to an agent to initiate a new task, continue an existing non-terminal
        task, or receive a direct stateless `Message` reply.

        If `configuration.returnImmediately` is `false` (default), the server waits until the
        task reaches a terminal (`TASK_STATE_COMPLETED`, `TASK_STATE_FAILED`, `TASK_STATE_CANCELED`,
        `TASK_STATE_REJECTED`) or interrupted (`TASK_STATE_INPUT_REQUIRED`, `TASK_STATE_AUTH_REQUIRED`) state.
      operationId: sendMessage
      parameters:
        - $ref: '#/components/parameters/A2AVersionHeader'
        - $ref: '#/components/parameters/A2AExtensionsHeader'
      requestBody:
        required: true
        content:
          application/a2a+json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      callbacks:
        sendMessageTaskUpdate:
          $ref: '#/components/callbacks/TaskUpdateWebhook'
      responses:
        '200':
          description: Agent response containing either a `Task` or a `Message`.
          content:
            application/a2a+json:
              schema:
                $ref: '#/components/schemas/SendMessageResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/SendMessageResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '415':
          $ref: '#/components/responses/UnsupportedMediaTypeError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /{tenant}/message:send:
    post:
      tags: [Messaging]
      summary: Send Message (Tenant-Scoped)
      description: Tenant-routed equivalent of `POST /message:send`.
      operationId: sendTenantMessage
      parameters:
        - $ref: '#/components/parameters/TenantPathParam'
        - $ref: '#/components/parameters/A2AVersionHeader'
        - $ref: '#/components/parameters/A2AExtensionsHeader'
      requestBody:
        required: true
        content:
          application/a2a+json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      callbacks:
        sendTenantMessageTaskUpdate:
          $ref: '#/components/callbacks/TaskUpdateWebhook'
      responses:
        '200':
          description: Agent response containing either a `Task` or a `Message`.
          content:
            application/a2a+json:
              schema:
                $ref: '#/components/schemas/SendMessageResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/SendMessageResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '415':
          $ref: '#/components/responses/UnsupportedMediaTypeError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /message:stream:
    post:
      tags: [Messaging]
      summary: Send Streaming Message
      description: |
        Sends a message to an agent and streams real-time `StreamResponse` events over
        Server-Sent Events (`text/event-stream`). Requires `AgentCard.capabilities.streaming == true`;
        otherwise returns `UnsupportedOperationError` (`HTTP 400`).
      operationId: sendStreamingMessage
      parameters:
        - $ref: '#/components/parameters/A2AVersionHeader'
        - $ref: '#/components/parameters/A2AExtensionsHeader'
      requestBody:
        required: true
        content:
          application/a2a+json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        '200':
          description: |
            Server-Sent Events stream delivering linearly ordered `StreamResponse` JSON objects
            (initial `task` or single `message`, followed by zero or more `statusUpdate` or
            `artifactUpdate` events until a terminal or interrupted state is reached).
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE stream where each `data:` payload is a serialized `StreamResponse`.
                example: |
                  data: {"task":{"id":"task-123","contextId":"ctx-456","status":{"state":"TASK_STATE_WORKING"}}}

                  data: {"artifactUpdate":{"taskId":"task-123","contextId":"ctx-456","artifact":{"artifactId":"art-1","parts":[{"text":"Hello"}]}}}

                  data: {"statusUpdate":{"taskId":"task-123","contextId":"ctx-456","status":{"state":"TASK_STATE_COMPLETED"}}}
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '415':
          $ref: '#/components/responses/UnsupportedMediaTypeError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /{tenant}/message:stream:
    post:
      tags: [Messaging]
      summary: Send Streaming Message (Tenant-Scoped)
      description: Tenant-routed equivalent of `POST /message:stream`.
      operationId: sendTenantStreamingMessage
      parameters:
        - $ref: '#/components/parameters/TenantPathParam'
        - $ref: '#/components/parameters/A2AVersionHeader'
        - $ref: '#/components/parameters/A2AExtensionsHeader'
      requestBody:
        required: true
        content:
          application/a2a+json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        '200':
          description: Server-Sent Events stream of `StreamResponse` objects.
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE stream where each `data:` payload is a serialized `StreamResponse`.
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '415':
          $ref: '#/components/responses/UnsupportedMediaTypeError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ===========================================================================
  # HTTP+JSON / REST Binding — Task Operations
  # ===========================================================================
  /tasks:
    get:
      tags: [Tasks]
      summary: List Tasks
      description: Lists tasks matching optional filter criteria with cursor-based pagination.
      operationId: listTasks
      parameters:
        - $ref: '#/components/parameters/A2AVersionHeader'
        - $ref: '#/components/parameters/A2AExtensionsHeader'
        - $ref: '#/components/parameters/ContextIdQueryParam'
        - $ref: '#/components/parameters/StatusQueryParam'
        - $ref: '#/components/parameters/PageSizeQueryParam'
        - $ref: '#/components/parameters/PageTokenQueryParam'
        - $ref: '#/components/parameters/HistoryLengthQueryParam'
        - $ref: '#/components/parameters/StatusTimestampAfterQueryParam'
        - $ref: '#/components/parameters/IncludeArtifactsQueryParam'
      responses:
        '200':
          description: Paginated list of matching tasks.
          content:
            application/a2a+json:
              schema:
                $ref: '#/components/schemas/ListTasksResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ListTasksResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /{tenant}/tasks:
    get:
      tags: [Tasks]
      summary: List Tasks (Tenant-Scoped)
      description: Tenant-routed equivalent of `GET /tasks`.
      operationId: listTenantTasks
      parameters:
        - $ref: '#/components/parameters/TenantPathParam'
        - $ref: '#/components/parameters/A2AVersionHeader'
        - $ref: '#/components/parameters/A2AExtensionsHeader'
        - $ref: '#/components/parameters/ContextIdQueryParam'
        - $ref: '#/components/parameters/StatusQueryParam'
        - $ref: '#/components/parameters/PageSizeQueryParam'
        - $ref: '#/components/parameters/PageTokenQueryParam'
        - $ref: '#/components/parameters/HistoryLengthQueryParam'
        - $ref: '#/components/parameters/StatusTimestampAfterQueryParam'
        - $ref: '#/components/parameters/IncludeArtifactsQueryParam'
      responses:
        '200':
          description: Paginated list of matching tasks.
          content:
            application/a2a+json:
              schema:
                $ref: '#/components/schemas/ListTasksResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ListTasksResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /tasks/{id}:
    get:
      tags: [Tasks]
      summary: Get Task
      description: Gets the latest state, artifacts, and optional message history of a task.
      operationId: getTask
      parameters:
        - $ref: '#/components/parameters/TaskIdParam'
        - $ref: '#/components/parameters/A2AVersionHeader'
        - $ref: '#/components/parameters/A2AExtensionsHeader'
        - $ref: '#/components/parameters/HistoryLengthQueryParam'
      responses:
        '200':
          description: Latest task state.
          content:
            application/a2a+json:
              schema:
                $ref: '#/components/schemas/Task'
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /{tenant}/tasks/{id}:
    get:
      tags: [Tasks]
      summary: Get Task (Tenant-Scoped)
      description: Tenant-routed equivalent of `GET /tasks/{id}`.
      operationId: getTenantTask
      parameters:
        - $ref: '#/components/parameters/TenantPathParam'
        - $ref: '#/components/parameters/TaskIdParam'
        - $ref: '#/components/parameters/A2AVersionHeader'
        - $ref: '#/components/parameters/A2AExtensionsHeader'
        - $ref: '#/components/parameters/HistoryLengthQueryParam'
      responses:
        '200':
          description: Latest task state.
          content:
            application/a2a+json:
              schema:
                $ref: '#/components/schemas/Task'
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /tasks/{id}:cancel:
    post:
      tags: [Tasks]
      summary: Cancel Task
      description: |
        Requests cancellation of an in-progress task. Returns `TaskNotCancelableError` (`HTTP 400`)
        if the task has already reached a terminal state.
      operationId: cancelTask
      parameters:
        - $ref: '#/components/parameters/TaskIdParam'
        - $ref: '#/components/parameters/A2AVersionHeader'
        - $ref: '#/components/parameters/A2AExtensionsHeader'
      requestBody:
        required: false
        content:
          application/a2a+json:
            schema:
              $ref: '#/components/schemas/CancelTaskRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/CancelTaskRequest'
      responses:
        '200':
          description: Updated task object reflecting cancellation.
          content:
            application/a2a+json:
              schema:
                $ref: '#/components/schemas/Task'
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /{tenant}/tasks/{id}:cancel:
    post:
      tags: [Tasks]
      summary: Cancel Task (Tenant-Scoped)
      description: Tenant-routed equivalent of `POST /tasks/{id}:cancel`.
      operationId: cancelTenantTask
      parameters:
        - $ref: '#/components/parameters/TenantPathParam'
        - $ref: '#/components/parameters/TaskIdParam'
        - $ref: '#/components/parameters/A2AVersionHeader'
        - $ref: '#/components/parameters/A2AExtensionsHeader'
      requestBody:
        required: false
        content:
          application/a2a+json:
            schema:
              $ref: '#/components/schemas/CancelTaskRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/CancelTaskRequest'
      responses:
        '200':
          description: Updated task object reflecting cancellation.
          content:
            application/a2a+json:
              schema:
                $ref: '#/components/schemas/Task'
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /tasks/{id}:subscribe:
    get:
      tags: [Tasks]
      summary: Subscribe to Task (GET — Protobuf HTTP Binding)
      description: |
        Subscribes to real-time updates for a task not in a terminal state via Server-Sent Events
        (`specification/a2a.proto` `google.api.http` binding). Returns `UnsupportedOperationError`
        (`HTTP 400`) if streaming is unsupported or the task is already in a terminal state
        (`TASK_STATE_COMPLETED`, `TASK_STATE_FAILED`, `TASK_STATE_CANCELED`, `TASK_STATE_REJECTED`).
      operationId: subscribeToTask
      parameters:
        - $ref: '#/components/parameters/TaskIdParam'
        - $ref: '#/components/parameters/A2AVersionHeader'
        - $ref: '#/components/parameters/A2AExtensionsHeader'
        - $ref: '#/components/parameters/LastEventIDHeader'
      responses:
        '200':
          description: Server-Sent Events stream of `StreamResponse` task updates.
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE stream where each `data:` payload is a serialized `StreamResponse`.
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Tasks]
      summary: Subscribe to Task (POST — Markdown Spec Binding)
      description: |
        POST variant of `SubscribeToTask` documented in `docs/specification.md` Sections 5.3 and 11.3.2.
        Streams `StreamResponse` events over Server-Sent Events until the task terminates or disconnects.
      operationId: subscribeToTaskPost
      parameters:
        - $ref: '#/components/parameters/TaskIdParam'
        - $ref: '#/components/parameters/A2AVersionHeader'
        - $ref: '#/components/parameters/A2AExtensionsHeader'
        - $ref: '#/components/parameters/LastEventIDHeader'
      responses:
        '200':
          description: Server-Sent Events stream of `StreamResponse` task updates.
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE stream where each `data:` payload is a serialized `StreamResponse`.
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /{tenant}/tasks/{id}:subscribe:
    get:
      tags: [Tasks]
      summary: Subscribe to Task (Tenant-Scoped GET)
      description: Tenant-routed equivalent of `GET /tasks/{id}:subscribe`.
      operationId: subscribeToTenantTask
      parameters:
        - $ref: '#/components/parameters/TenantPathParam'
        - $ref: '#/components/parameters/TaskIdParam'
        - $ref: '#/components/parameters/A2AVersionHeader'
        - $ref: '#/components/parameters/A2AExtensionsHeader'
        - $ref: '#/components/parameters/LastEventIDHeader'
      responses:
        '200':
          description: Server-Sent Events stream of `StreamResponse` task updates.
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
