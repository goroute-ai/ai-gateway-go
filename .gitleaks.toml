title = "GoRoute AI Gateway Gitleaks Configuration"

[extend]
useDefault = true

[[allowlists]]
description = "Narrow allowlist for synthetic test fixtures, dev defaults, and guardrail UI examples"
paths = [
  '''^internal/config/config_test\.go$''',
  '''^internal/logger/scrub_test\.go$''',
  '''^internal/logger/hardening_test\.go$''',
  '''^internal/guardrails/.*_test\.go$''',
  '''^tests/guardrails/.*_test\.go$''',
  '''^tests/e2e/.*_test\.go$''',
  '''^web/src/views/GuardrailsView\.tsx$''',
  '''^web/dist/assets/GuardrailsView-.*\.js$''',
  '''^internal/ui/dist/assets/GuardrailsView-.*\.js$''',
  '''^tests/ui-e2e/node_modules/''',
]
regexes = [
  '''sk-gw-master-admin-default-key-change-me''',
  '''0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef''',
  '''fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210''',
  '''gateway-jwt-hmac-secret-change-me''',
  '''\$\{GATEWAY_MASTER_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef\}''',
  '''gpt-3\.5-turbo-instruct''',
  '''idNew1\.KeyRPMLimit''',
  '''incoming-oidc-hs256-secret-32-bytes''',
  '''vault-outbound-hs256-secret-32b''',
  '''imdsV2SecretKey''',
  '''test-hs256-secret-for-fail-closed''',
  '''IQoJb3JpZ2luX2VjECoaCXVzLWVhc3QtMSJG''',
]

[[allowlists]]
description = "Deterministic synthetic credentials in local/CI Docker prod-test harness (never real secrets)"
condition = "AND"
paths = [
  '''^deployments/prod-test/docker-compose\.prod-test\.yml$''',
  '''^deployments/prod-test/realm-prod-test\.json$''',
  '''^tests/prod-docker/run_prod_tests\.sh$''',
  '''^tests/prod-docker/prod_e2e_test\.go$''',
]
regexes = [
  '''a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f90''',
  '''b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f90a1''',
  '''goroute-prod-oidc-secret-2026''',
  '''goroute-ci-(mint|es256|eddsa)-secret-2026''',
]
