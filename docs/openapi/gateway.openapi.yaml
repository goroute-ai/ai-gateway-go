  /v1/responses:
    post:
      operationId: createResponse
      summary: Create a text or tool-calling response
      description: Supports text input, tool calling, reasoning effort, structured outputs, and streamed or non-streamed responses. Persisted conversation state and response retrieval are not currently supported.
      requestBody:
        required: true
        content:
