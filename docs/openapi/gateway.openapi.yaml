  parameters:
    FileID:
      name: file_id
      in: path
      required: true
      schema:
        type: string
    BatchID:
      name: batch_id
      in: path
      required: true
      schema:
        type: string
paths:
  /auth/me:
    get:
      operationId: operatorProfile
      summary: Get the current operator profile
      security:
        - OperatorSession: []
        - VirtualKeyBearer: []
      responses:
        '200':
          description: Operator profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorSessionResponse'
        '401':
          description: Authentication required
  /auth/logout:
    post:
      operationId: operatorLogout
      summary: Revoke the current operator session
      security:
        - OperatorSession: []
        - VirtualKeyBearer: []
      parameters:
        - in: header
          name: X-CSRF-Token
          schema:
            type: string
          description: Required for cookie authentication.
      responses:
        '200':
          description: Session cleared
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  end_session_url:
                    type: string
        '401':
          description: Authentication required
        '403':
          description: Invalid CSRF token
  /auth/sso/providers:
    get:
      operationId: listAuthSSOProviders
      summary: List configured Control Plane SSO providers
      security: []
      responses:
        '200':
          description: Configured SSO providers
  /auth/sso/{provider}/login:
    get:
      operationId: startAuthSSOLogin
      summary: Initiate Control Plane OIDC/SSO PKCE login
      security: []
      parameters:
        - in: path
          name: provider
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Authorization URL metadata when format=json
        '302':
          description: Redirect to identity provider authorization endpoint
  /auth/sso/{provider}/callback:
    get:
      operationId: completeAuthSSOCallback
      summary: Complete Control Plane OIDC/SSO callback and establish a session
      security: []
      parameters:
        - in: path
          name: provider
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Session established
        '302':
          description: Redirect back to Control Plane UI
        '401':
          description: Invalid or unverified identity assertion
  /auth/cli/start:
    post:
      operationId: startAuthCLILogin
      summary: Start a CLI browser-mediated login transaction
      security: []
      responses:
        '200':
          description: Pending CLI login challenge created
  /auth/cli/poll/{login_id}:
    get:
      operationId: pollAuthCLILogin
      summary: Poll CLI browser login status and retrieve a short-lived token once authorized
      security: []
      parameters:
        - in: path
          name: login_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: CLI login status
        '404':
          description: Unknown or expired login_id
  /auth/cli/complete/{login_id}:
    post:
      operationId: completeAuthCLILogin
      summary: Authorize a pending CLI login from an authenticated Control Plane session
      security:
        - OperatorSession: []
        - VirtualKeyBearer: []
      parameters:
        - in: path
          name: login_id
          required: true
          schema:
            type: string
        - in: header
          name: X-CSRF-Token
          schema:
            type: string
      responses:
        '200':
          description: CLI login authorized
        '401':
          description: Authentication required
        '403':
          description: Insufficient privileges or invalid CSRF token
  /v1/chat/completions:
    post:
      operationId: createChatCompletion
