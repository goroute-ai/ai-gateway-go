openapi: 3.1.0
info:
  title: Enterprise AI Gateway Unified API
  version: 0.2.0
  description: >
    Production-grade OpenAI-compatible Unified AI Gateway API supporting verified spec-first model providers
    (OpenAI, Anthropic Claude, Groq, OpenRouter, and Ollama) with intelligent routing, load balancing, retries/fallbacks,
    virtual keys, Redis Lua rate limiting, FinOps spend tracking, MCP 2026-07-28 tools, and Linux Foundation A2A v1.0.
servers:
  - url: http://localhost:8080
    description: Local Gateway Server
security:
  - VirtualKeyBearer: []
components:
  securitySchemes:
    VirtualKeyBearer:
      type: http
      scheme: bearer
      description: Virtual API Key (`sk-gw-...`) or Admin Master Key
    OperatorSession:
      type: apiKey
      in: cookie
      name: goroute_session
      description: Signed operator session cookie. Cookie-authenticated mutations also require X-CSRF-Token.
  headers:
    X-Gateway-Cache:
      description: "Response cache outcome for eligible non-streaming requests (`HIT` or `MISS`). Omitted when caching is disabled or bypassed."
      schema:
        type: string
        enum: [HIT, MISS]
    X-Gateway-Cache-Type:
      description: "Cache match mode emitted on `X-Gateway-Cache: HIT` (`exact` or `semantic`)."
      schema:
        type: string
        enum: [exact, semantic]
    X-Gateway-Cache-Similarity:
      description: "Cosine similarity score (0..1) emitted on `X-Gateway-Cache-Type: semantic` hits."
      schema:
        type: string
  schemas:
    KEKRotationSummary:
      type: object
      properties:
        credentials_rewrapped:
          type: integer
        mcp_servers_rewrapped:
          type: integer
        a2a_agents_rewrapped:
          type: integer
        guardrails_rewrapped:
          type: integer
        staged_virtual_keys_rewrapped:
          type: integer
        source_pod:
          type: string
    OperatorProfile:
      type: object
      properties:
        actor_id:
          type: string
        role:
          type: string
        org_id:
          type: string
        team_id:
          type: string
        auth_method:
          type: string
        session_id:
          type: string
    OperatorSessionResponse:
      type: object
      properties:
        operator:
          $ref: '#/components/schemas/OperatorProfile'
        user:
          $ref: '#/components/schemas/AdminUser'
        csrf_token:
          type: string
        token:
          type: string
        session_token:
          type: string
        expires_at:
          type: string
          format: date-time
    ChatCompletionRequest:
      type: object
      required:
        - model
        - messages
      properties:
        model:
          type: string
          description: Explicit model name (`gpt-4o-mini`, `claude-haiku-4-5-20251001`, `openai/gpt-oss-20b`, `openai/gpt-4o-mini`) or smart routing alias (`auto`, `fast`, `reasoning`, `coding`).
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
        tools:
          type: array
          items:
            $ref: '#/components/schemas/Tool'
        tool_choice:
          description: Controls which (if any) tool is called by the model.
        temperature:
          type: number
          format: double
        top_p:
          type: number
          format: double
        max_tokens:
          type: integer
        stop:
          type: array
          items:
            type: string
        stream:
          type: boolean
          default: false
        stream_options:
          type: object
          properties:
            include_usage:
              type: boolean
        response_format:
          type: object
          properties:
            type:
              type: string
              enum: [text, json_object, json_schema]
        reasoning_effort:
          type: string
          enum: [none, minimal, low, medium, high, xhigh, max]
        user:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string
        goroute_extensions:
          $ref: '#/components/schemas/GoRouteExtensions'
    ChatMessage:
      type: object
      required:
        - role
      properties:
        role:
          type: string
          enum: [system, developer, user, assistant, tool]
        content:
          oneOf:
            - type: string
            - type: array
              items:
                $ref: '#/components/schemas/ContentPart'
        parts:
          type: array
          items:
            $ref: '#/components/schemas/ContentPart'
        name:
          type: string
        tool_call_id:
          type: string
        cache_control:
          $ref: '#/components/schemas/CacheControl'
        annotations:
          type: array
          items:
            $ref: '#/components/schemas/Annotation'
        tool_calls:
          type: array
          items:
            $ref: '#/components/schemas/ToolCall'
        reasoning_content:
          type: string
    ContentPart:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [text, input_text, image_url, input_image, document]
        text:
          type: string
        image_url:
          oneOf:
            - type: string
              format: uri
            - type: object
              required: [url]
              properties:
                url:
                  type: string
                  format: uri
                detail:
                  type: string
        document:
          $ref: '#/components/schemas/DocumentPart'
        file_data:
          type: string
          description: Base64-encoded file bytes for input_file parts.
        file_url:
          type: string
          description: HTTPS file URL for input_file parts.
        filename:
          type: string
        mime_type:
          type: string
        cache_control:
          $ref: '#/components/schemas/CacheControl'
    DocumentPart:
      type: object
      properties:
        mime_type:
          type: string
        data:
          type: string
          description: Base64-encoded document bytes.
        url:
          type: string
          description: HTTPS document URI.
        filename:
          type: string
    CacheControl:
      type: object
      properties:
        type:
          type: string
          enum: [ephemeral]
        ttl:
          type: string
    Annotation:
      type: object
      properties:
        type:
          type: string
        url_citation:
          type: object
          properties:
            url:
              type: string
            title:
              type: string
            start_index:
              type: integer
            end_index:
              type: integer
    Tool:
      type: object
      required:
        - type
        - function
      properties:
        type:
          type: string
          enum: [function]
        function:
          type: object
          required:
            - name
          properties:
            name:
              type: string
            description:
              type: string
            parameters:
              type: object
            strict:
              type: boolean
        cache_control:
          $ref: '#/components/schemas/CacheControl'
    ToolCall:
      type: object
      required:
        - id
        - type
        - function
      properties:
        index:
          type: integer
        id:
          type: string
        type:
          type: string
          enum: [function]
        function:
          type: object
          required:
            - name
            - arguments
          properties:
            name:
              type: string
            arguments:
              type: string
    ChatCompletionResponse:
      type: object
      required:
        - id
        - object
        - created
        - model
        - choices
        - usage
      properties:
        id:
          type: string
        object:
          type: string
          enum: [chat.completion]
        created:
          type: integer
          format: int64
        model:
          type: string
        provider:
          type: string
        choices:
          type: array
          items:
            type: object
            required:
              - index
              - message
              - finish_reason
            properties:
              index:
                type: integer
              message:
                $ref: '#/components/schemas/ChatMessage'
              finish_reason:
                type: string
        usage:
          $ref: '#/components/schemas/TokenUsage'
        system_fingerprint:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string
    TokenUsage:
      type: object
      properties:
        prompt_tokens:
          type: integer
        completion_tokens:
          type: integer
        total_tokens:
          type: integer
        cached_prompt_tokens:
          type: integer
        cache_creation_tokens:
          type: integer
        reasoning_tokens:
          type: integer
    EmbeddingRequest:
      type: object
      required:
        - model
        - input
      properties:
        model:
          type: string
        input:
          anyOf:
            - type: string
            - type: array
              items:
                type: string
        encoding_format:
          type: string
          enum: [float, base64]
        dimensions:
          type: integer
        input_type:
          type: string
          description: Optional provider-specific embedding intent such as search_query or search_document.
        goroute_extensions:
          $ref: '#/components/schemas/GoRouteExtensions'
    GoRouteExtensions:
      type: object
      properties:
        task_id:
          type: string
        context_id:
          type: string
        tags:
          type: array
          items:
            type: string
        allowed_region:
          type: string
        session_id:
          type: string
        preferred_deployment_id:
          type: string
        priority:
          type: integer
        hedge_after_ms:
          type: integer
        routing_strategy:
          type: string
        drop_unsupported_params:
          type: boolean
    EmbeddingResponse:
      type: object
      required:
        - object
        - data
        - model
        - usage
      properties:
        object:
          type: string
          enum: [list]
        data:
          type: array
          items:
            type: object
            properties:
              object:
                type: string
              index:
                type: integer
              embedding:
                type: array
                items:
                  type: number
                  format: double
        model:
          type: string
        usage:
          $ref: '#/components/schemas/TokenUsage'
    ModerationRequest:
      type: object
      required:
        - input
      properties:
        model:
          type: string
        input:
          anyOf:
            - type: string
            - type: array
              items:
                type: string
        goroute_extensions:
          $ref: '#/components/schemas/GoRouteExtensions'
    ModerationResponse:
      type: object
      required:
        - id
        - model
        - results
      properties:
        id:
          type: string
        model:
          type: string
        results:
          type: array
          items:
            type: object
            properties:
              flagged:
                type: boolean
              categories:
                type: object
              category_scores:
                type: object
    LegacyCompletionRequest:
      type: object
      required:
        - model
        - prompt
      properties:
        model:
          type: string
        prompt:
          anyOf:
            - type: string
            - type: array
              items:
                type: string
        max_tokens:
          type: integer
        temperature:
          type: number
        stream:
          type: boolean
        goroute_extensions:
          $ref: '#/components/schemas/GoRouteExtensions'
    LegacyCompletionResponse:
      type: object
      required:
        - id
        - model
        - choices
        - usage
      properties:
        id:
          type: string
        object:
          type: string
        model:
          type: string
        provider:
          type: string
        choices:
          type: array
          items:
            type: object
            properties:
              text:
                type: string
              index:
                type: integer
              finish_reason:
                type: string
        usage:
          $ref: '#/components/schemas/TokenUsage'
    TokenizeRequest:
      type: object
      properties:
        model:
          type: string
        prompt:
          anyOf:
            - type: string
            - type: array
              items:
                type: string
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
        tools:
          type: array
          items:
            $ref: '#/components/schemas/Tool'
    TokenizeResponse:
      type: object
      required:
        - model
        - profile
        - count
        - total_tokens
      properties:
        model:
          type: string
        profile:
          type: string
        count:
          type: integer
        total_tokens:
          type: integer
    ModelCard:
      type: object
      required:
        - id
        - object
        - created
        - owned_by
      properties:
        id:
          type: string
        object:
          type: string
          enum: [model]
        created:
          type: integer
          format: int64
        owned_by:
          type: string
        provider:
          type: string
        max_input_tokens:
          type: integer
        max_output_tokens:
          type: integer
        capabilities:
          type: array
          items:
            type: string
        input_cost_micros_per_1m:
          type: integer
          format: int64
        output_cost_micros_per_1m:
          type: integer
          format: int64
    ModelsListResponse:
      type: object
      required:
        - object
        - data
      properties:
        object:
          type: string
          enum: [list]
        data:
          type: array
          items:
            $ref: '#/components/schemas/ModelCard'
    AudioTranscriptionResponse:
      type: object
      required:
        - text
      properties:
        text:
          type: string
        duration_ms:
          type: integer
          format: int64
      additionalProperties: true
    AudioSpeechRequest:
      type: object
      required:
        - model
        - input
        - voice
      properties:
        model:
          type: string
        input:
          type: string
        voice:
          type: string
        response_format:
          type: string
          enum: [mp3, opus, aac, flac, wav]
        speed:
          type: number
        goroute_extensions:
          $ref: '#/components/schemas/GoRouteExtensions'
    ImageGenerationRequest:
      type: object
      required:
        - prompt
      properties:
        prompt:
          type: string
        model:
          type: string
        n:
          type: integer
        quality:
          type: string
          enum: [standard, hd, low, medium, high, auto]
        size:
          type: string
        response_format:
          type: string
          enum: [url, b64_json]
        goroute_extensions:
          $ref: '#/components/schemas/GoRouteExtensions'
    ImageGenerationResponse:
      type: object
      required:
        - created
        - data
      properties:
        created:
          type: integer
        data:
          type: array
          items:
            type: object
            properties:
              url:
                type: string
              b64_json:
                type: string
              revised_prompt:
                type: string
    FileObject:
      type: object
      required:
        - id
        - org_id
        - bytes
        - created_at
        - filename
        - purpose
        - status
      properties:
        id:
          type: string
        org_id:
          type: string
        team_id:
          type: string
        user_id:
          type: string
        bytes:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        filename:
          type: string
        purpose:
          type: string
        status:
          type: string
        content_sha256:
          type: string
        storage_path:
          type: string
        upstream_id:
          type: string
        upstream_provider:
          type: string
        expires_at:
          type: string
          format: date-time
    FileListResponse:
      type: object
      required:
        - object
        - data
      properties:
        object:
          type: string
          enum: [list]
        data:
          type: array
          items:
            $ref: '#/components/schemas/FileObject'
    FileDeleteResponse:
      type: object
      required:
        - id
        - object
        - deleted
      properties:
        id:
          type: string
        object:
          type: string
          enum: [file]
        deleted:
          type: boolean
    BatchCreateRequest:
      type: object
      required:
        - input_file_id
      properties:
        input_file_id:
          type: string
        endpoint:
          type: string
        completion_window:
          type: string
        metadata:
          type: object
          additionalProperties: true
    BatchObject:
      type: object
      required:
        - id
        - org_id
        - input_file_id
        - endpoint
        - status
        - completion_window
        - created_at
        - request_counts
      properties:
        id:
          type: string
        org_id:
          type: string
        team_id:
          type: string
        input_file_id:
          type: string
        output_file_id:
          type: string
        error_file_id:
          type: string
        endpoint:
          type: string
        status:
          type: string
        completion_window:
          type: string
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        metadata:
          type: object
          additionalProperties: true
        request_counts:
          type: object
          required:
            - total
            - completed
            - failed
          properties:
            total:
              type: integer
            completed:
              type: integer
            failed:
              type: integer
        estimated_tokens:
          type: integer
          format: int64
        reserved_cost_micros:
          type: integer
          format: int64
        upstream_id:
          type: string
        upstream_provider:
          type: string
    BatchListResponse:
      type: object
      required:
        - object
        - data
      properties:
        object:
          type: string
          enum: [list]
        data:
          type: array
          items:
            $ref: '#/components/schemas/BatchObject'
    ResponsesAPIRequest:
      type: object
      required:
        - model
        - input
      properties:
        model:
          type: string
        input:
          description: Input text or an ordered sequence of messages and function-call items.
          oneOf:
            - type: string
            - type: array
              items:
                oneOf:
                  - $ref: '#/components/schemas/ResponsesMessageInputItem'
                  - $ref: '#/components/schemas/ResponsesFunctionCallInputItem'
                  - $ref: '#/components/schemas/ResponsesFunctionCallOutputInputItem'
        instructions:
          type: string
        stream:
          type: boolean
        temperature:
          type: number
        max_output_tokens:
          type: integer
        tools:
          type: array
          items:
            type: object
        tool_choice:
          description: Tool choice policy ("auto", "required", "none", or function selector)
        reasoning:
          type: object
          properties:
            effort:
              type: string
              enum: [none, minimal, low, medium, high, xhigh, max]
        text:
          type: object
          properties:
            format:
              type: object
              properties:
                type:
                  type: string
                  enum: [text, json_object, json_schema]
                json_schema:
                  type: object
        metadata:
          type: object
          additionalProperties: true
        goroute_extensions:
          $ref: '#/components/schemas/GoRouteExtensions'
    AnthropicMessagesRequest:
      type: object
      required:
        - model
        - max_tokens
        - messages
      properties:
        model:
          type: string
        max_tokens:
          type: integer
        messages:
          type: array
          items:
            type: object
            additionalProperties: true
        system:
          oneOf:
            - type: string
            - type: array
              items:
                type: object
                additionalProperties: true
        stream:
          type: boolean
        temperature:
          type: number
        top_p:
          type: number
        stop_sequences:
          type: array
          items:
            type: string
        tools:
          type: array
          items:
            type: object
            additionalProperties: true
        user:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string
        goroute_extensions:
          $ref: '#/components/schemas/GoRouteExtensions'
    AnthropicMessagesResponse:
      type: object
      required:
        - id
        - type
        - role
        - model
        - content
        - usage
      properties:
        id:
          type: string
        type:
          type: string
          enum: [message]
        role:
          type: string
          enum: [assistant]
        model:
          type: string
        content:
          type: array
          items:
            type: object
            required:
              - type
            properties:
              type:
                type: string
                enum: [text, tool_use]
              text:
                type: string
              id:
                type: string
              name:
                type: string
              input:
                type: object
                additionalProperties: true
        stop_reason:
          oneOf:
            - type: string
            - type: 'null'
        stop_sequence:
          oneOf:
            - type: string
            - type: 'null'
        usage:
          type: object
          required:
            - input_tokens
            - output_tokens
          properties:
            input_tokens:
              type: integer
            output_tokens:
              type: integer
    AnthropicCountTokensRequest:
      type: object
      required:
        - messages
      properties:
        model:
          type: string
        messages:
          type: array
          items:
            type: object
            additionalProperties: true
        system:
          oneOf:
            - type: string
            - type: array
              items:
                type: object
                additionalProperties: true
        tools:
          type: array
          items:
            type: object
            additionalProperties: true
    AnthropicCountTokensResponse:
      type: object
      required:
        - input_tokens
      properties:
        input_tokens:
          type: integer
    ResponsesMessageInputItem:
      type: object
      required: [role]
      properties:
        type:
          type: string
          enum: [message]
        role:
          type: string
          enum: [system, developer, user, assistant, tool]
        content:
          oneOf:
            - type: string
            - type: array
              items:
                $ref: '#/components/schemas/ContentPart'
            - type: 'null'
        tool_call_id:
          type: string
        tool_calls:
          type: array
          items:
            $ref: '#/components/schemas/ToolCall'
    ResponsesFunctionCallInputItem:
      type: object
      required: [type, call_id, name, arguments]
      properties:
        type:
          type: string
          const: function_call
        call_id:
          type: string
        name:
          type: string
        arguments:
          type: string
    ResponsesFunctionCallOutputInputItem:
      type: object
      required: [type, call_id, output]
      properties:
        type:
          type: string
          const: function_call_output
        call_id:
          type: string
        output:
          oneOf:
            - type: string
            - type: array
              items:
                type: object
                properties:
                  type:
                    type: string
                  text:
                    type: string
    ResponsesAPIResponse:
      type: object
      required:
        - id
        - object
        - created_at
        - status
        - model
        - output
      properties:
        id:
          type: string
        object:
          type: string
          enum: [response]
        created_at:
          type: integer
          format: int64
        status:
          type: string
        model:
          type: string
        output:
          type: array
          items:
            type: object
            required:
              - id
              - type
              - status
            properties:
              id:
                type: string
              type:
                type: string
              status:
                type: string
              role:
                type: string
              content:
                type: array
                items:
                  type: object
                  properties:
                    type:
                      type: string
                    text:
                      type: string
              call_id:
                type: string
              name:
                type: string
              arguments:
                type: string
        usage:
          $ref: '#/components/schemas/TokenUsage'
    AdminUser:
      type: object
      required:
        - id
        - org_id
        - email
        - role
        - is_active
        - created_at
        - updated_at
      properties:
        id:
          type: string
        org_id:
          type: string
        team_id:
          type: string
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [platform_admin, org_admin, team_admin, developer, service_account, viewer]
        oidc_issuer:
          type: string
          description: Verified OIDC issuer that owns the linked subject.
        oidc_subject:
          type: string
        scim_external_id:
          type: string
        scim_active:
          type: boolean
        max_budget_micros:
          type: integer
          format: int64
        temp_budget_increase_micros:
          type: integer
          format: int64
        temp_budget_expires_at:
          type: string
          format: date-time
        soft_budget_micros:
          type: integer
          format: int64
        throttle_on_budget_exceeded:
          type: boolean
        budget_fallbacks:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        spent_micros:
          type: integer
          format: int64
        budget_reset_period:
          type: string
        budget_reset_at:
          type: string
          format: date-time
        rpm_limit:
          type: integer
        tpm_limit:
          type: integer
        max_concurrent_requests:
          type: integer
        is_active:
          type: boolean
