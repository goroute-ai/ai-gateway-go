openapi: 3.1.0
info:
  title: Enterprise AI Gateway Unified API
  version: 1.1.0
  description: >
    Production-grade OpenAI-compatible Unified AI Gateway API supporting universal model providers
    (OpenAI, Anthropic Claude, Google Gemini, Google Vertex AI, AWS Bedrock, Cohere, Mistral AI, Ollama,
    and 30+ certified OpenAI-compatible platforms) with intelligent routing, load balancing, retries/fallbacks,
    virtual keys, Redis Lua rate limiting, FinOps spend tracking, MCP 2026-07-28 tools, and Linux Foundation A2A v1.0.
servers:
  - url: http://localhost:8080
    description: Local Gateway Server
security:
  - VirtualKeyBearer: []
components:
  securitySchemes:
    VirtualKeyBearer:
      type: http
      scheme: bearer
      description: Virtual API Key (`sk-gw-...`) or Admin Master Key
  schemas:
    ChatCompletionRequest:
      type: object
      required:
        - model
        - messages
      properties:
        model:
          type: string
          description: Explicit model name (`gpt-4.1`, `claude-sonnet-4-20250514`, `gemini-2.5-pro`) or smart routing alias (`auto`, `fast`, `reasoning`, `coding`).
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
        tools:
          type: array
          items:
            $ref: '#/components/schemas/Tool'
        tool_choice:
          description: Controls which (if any) tool is called by the model.
        temperature:
          type: number
          format: double
        top_p:
          type: number
          format: double
        max_tokens:
          type: integer
        stop:
          type: array
          items:
            type: string
        stream:
          type: boolean
          default: false
        stream_options:
          type: object
          properties:
            include_usage:
              type: boolean
        response_format:
          type: object
          properties:
            type:
              type: string
              enum: [text, json_object, json_schema]
        reasoning_effort:
          type: string
          enum: [none, minimal, low, medium, high, xhigh, max]
        user:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string
        goroute_extensions:
          $ref: '#/components/schemas/GoRouteExtensions'
    ChatMessage:
      type: object
      required:
        - role
      properties:
        role:
          type: string
          enum: [system, developer, user, assistant, tool]
        content:
          oneOf:
            - type: string
            - type: array
              items:
                $ref: '#/components/schemas/ContentPart'
        parts:
          type: array
          items:
            $ref: '#/components/schemas/ContentPart'
        name:
          type: string
        tool_call_id:
          type: string
        cache_control:
          $ref: '#/components/schemas/CacheControl'
        annotations:
          type: array
          items:
            $ref: '#/components/schemas/Annotation'
        tool_calls:
          type: array
          items:
            $ref: '#/components/schemas/ToolCall'
        reasoning_content:
          type: string
    ContentPart:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [text, input_text, image_url, input_image, document]
        text:
          type: string
        image_url:
          oneOf:
            - type: string
              format: uri
            - type: object
              required: [url]
              properties:
                url:
                  type: string
                  format: uri
                detail:
                  type: string
        document:
          $ref: '#/components/schemas/DocumentPart'
        file_data:
          type: string
          description: Base64-encoded file bytes for input_file parts.
        file_url:
          type: string
          description: HTTPS file URL for input_file parts.
        filename:
          type: string
        mime_type:
          type: string
        cache_control:
          $ref: '#/components/schemas/CacheControl'
    DocumentPart:
      type: object
      properties:
        mime_type:
          type: string
        data:
          type: string
          description: Base64-encoded document bytes.
        url:
          type: string
          description: HTTPS or gs:// document URI.
        filename:
          type: string
    CacheControl:
      type: object
      properties:
        type:
          type: string
          enum: [ephemeral]
        ttl:
          type: string
    Annotation:
      type: object
      properties:
        type:
          type: string
        url_citation:
          type: object
          properties:
            url:
              type: string
            title:
              type: string
            start_index:
              type: integer
            end_index:
              type: integer
    Tool:
      type: object
      required:
        - type
        - function
      properties:
        type:
          type: string
          enum: [function]
        function:
          type: object
          required:
            - name
          properties:
            name:
              type: string
            description:
              type: string
            parameters:
              type: object
            strict:
              type: boolean
        cache_control:
          $ref: '#/components/schemas/CacheControl'
    ToolCall:
      type: object
      required:
        - id
        - type
        - function
      properties:
        id:
          type: string
        type:
          type: string
          enum: [function]
        function:
          type: object
          required:
            - name
            - arguments
          properties:
            name:
              type: string
            arguments:
              type: string
    ChatCompletionResponse:
      type: object
      required:
        - id
        - object
        - created
        - model
        - choices
        - usage
      properties:
        id:
          type: string
        object:
          type: string
          enum: [chat.completion]
        created:
          type: integer
          format: int64
        model:
          type: string
        choices:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
              message:
                $ref: '#/components/schemas/ChatMessage'
              finish_reason:
                type: string
        usage:
          $ref: '#/components/schemas/TokenUsage'
    TokenUsage:
      type: object
      properties:
        prompt_tokens:
          type: integer
        completion_tokens:
          type: integer
        total_tokens:
          type: integer
        cached_prompt_tokens:
          type: integer
        reasoning_tokens:
          type: integer
    EmbeddingRequest:
      type: object
      required:
        - model
        - input
      properties:
        model:
          type: string
        input:
          anyOf:
            - type: string
            - type: array
              items:
                type: string
        encoding_format:
          type: string
          enum: [float, base64]
        dimensions:
          type: integer
        input_type:
          type: string
          description: Optional provider-specific embedding intent such as search_query or search_document.
        goroute_extensions:
          $ref: '#/components/schemas/GoRouteExtensions'
    GoRouteExtensions:
      type: object
      properties:
        task_id:
          type: string
        context_id:
          type: string
        guardrails:
          type: array
          items:
            $ref: '#/components/schemas/GuardrailRequestOverride'
        tags:
          type: array
          items:
            type: string
        allowed_region:
          type: string
        session_id:
          type: string
        preferred_deployment_id:
          type: string
        priority:
          type: integer
        hedge_after_ms:
          type: integer
    GuardrailRequestOverride:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        enabled:
          type: boolean
        action:
          type: string
          enum: [block, redact, audit]
        config:
          type: object
          additionalProperties: true
    EmbeddingResponse:
      type: object
      required:
        - object
        - data
        - model
        - usage
      properties:
        object:
          type: string
          enum: [list]
        data:
          type: array
          items:
            type: object
            properties:
              object:
                type: string
              index:
                type: integer
              embedding:
                type: array
                items:
                  type: number
                  format: double
        model:
          type: string
        usage:
          $ref: '#/components/schemas/TokenUsage'
    RerankRequest:
      type: object
      required:
        - model
        - query
        - documents
      properties:
        model:
          type: string
        query:
          type: string
        documents:
          type: array
          items:
            anyOf:
              - type: string
              - type: object
        top_n:
          type: integer
        return_documents:
          type: boolean
    RerankResponse:
      type: object
      required:
        - id
        - results
      properties:
        id:
          type: string
        results:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
              relevance_score:
                type: number
    ModerationRequest:
      type: object
      required:
        - input
      properties:
        model:
          type: string
        input:
          anyOf:
            - type: string
            - type: array
              items:
                type: string
    ModerationResponse:
      type: object
      required:
        - id
        - model
        - results
      properties:
        id:
          type: string
        model:
          type: string
        results:
          type: array
          items:
            type: object
            properties:
              flagged:
                type: boolean
              categories:
                type: object
              category_scores:
                type: object
    LegacyCompletionRequest:
      type: object
      required:
        - model
        - prompt
      properties:
        model:
          type: string
        prompt:
          anyOf:
            - type: string
            - type: array
              items:
                type: string
        max_tokens:
          type: integer
        temperature:
          type: number
        stream:
          type: boolean
    LegacyCompletionResponse:
      type: object
      required:
        - id
        - object
        - model
        - choices
      properties:
        id:
          type: string
        object:
          type: string
        model:
          type: string
        choices:
          type: array
          items:
            type: object
            properties:
              text:
                type: string
              index:
                type: integer
              finish_reason:
                type: string
    TokenizeRequest:
      type: object
      required:
        - model
      properties:
        model:
          type: string
        input:
          type: string
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
    TokenizeResponse:
      type: object
      required:
        - count
        - model
      properties:
        count:
          type: integer
        model:
          type: string
        tokens:
          type: array
          items:
            type: integer
    AudioSpeechRequest:
      type: object
      required:
        - model
        - input
        - voice
      properties:
        model:
          type: string
        input:
          type: string
        voice:
          type: string
        response_format:
          type: string
          enum: [mp3, opus, aac, flac, wav]
        speed:
          type: number
    ImageGenerationRequest:
      type: object
      required:
        - prompt
      properties:
        prompt:
          type: string
        model:
          type: string
        n:
          type: integer
        quality:
          type: string
          enum: [standard, hd]
        size:
          type: string
        response_format:
          type: string
          enum: [url, b64_json]
    ImageGenerationResponse:
      type: object
      required:
        - created
        - data
      properties:
        created:
          type: integer
        data:
          type: array
          items:
            type: object
            properties:
              url:
                type: string
              b64_json:
                type: string
              revised_prompt:
                type: string
    FileObject:
      type: object
      required:
        - id
        - bytes
        - created_at
        - filename
        - purpose
        - status
      properties:
        id:
          type: string
        bytes:
          type: integer
        created_at:
          type: integer
        filename:
          type: string
        purpose:
          type: string
        status:
          type: string
    BatchObject:
      type: object
      required:
        - id
        - input_file_id
        - endpoint
        - status
      properties:
        id:
          type: string
        input_file_id:
          type: string
        output_file_id:
          type: string
        endpoint:
          type: string
        status:
          type: string
        request_counts:
          type: object
          properties:
            total:
              type: integer
            completed:
              type: integer
            failed:
              type: integer
    ResponsesAPIRequest:
      type: object
      required:
        - model
        - input
      properties:
        model:
          type: string
        input:
          description: Input text or an ordered sequence of messages and function-call items.
          oneOf:
            - type: string
            - type: array
              items:
                oneOf:
                  - $ref: '#/components/schemas/ResponsesMessageInputItem'
                  - $ref: '#/components/schemas/ResponsesFunctionCallInputItem'
                  - $ref: '#/components/schemas/ResponsesFunctionCallOutputInputItem'
        instructions:
          type: string
        stream:
          type: boolean
        temperature:
          type: number
        max_output_tokens:
          type: integer
        tools:
          type: array
          items:
            type: object
        tool_choice:
          description: Tool choice policy ("auto", "required", "none", or function selector)
        reasoning:
          type: object
          properties:
            effort:
              type: string
              enum: [none, minimal, low, medium, high, xhigh, max]
        text:
          type: object
          properties:
            format:
              type: object
              properties:
                type:
                  type: string
                  enum: [text, json_object, json_schema]
                json_schema:
                  type: object
        metadata:
          type: object
          additionalProperties: true
    ResponsesMessageInputItem:
      type: object
      required: [role]
      properties:
        type:
          type: string
          enum: [message]
        role:
          type: string
          enum: [system, developer, user, assistant, tool]
        content:
          oneOf:
            - type: string
            - type: array
              items:
                $ref: '#/components/schemas/ContentPart'
            - type: 'null'
        tool_call_id:
          type: string
        tool_calls:
          type: array
          items:
            $ref: '#/components/schemas/ToolCall'
    ResponsesFunctionCallInputItem:
      type: object
      required: [type, call_id, name, arguments]
      properties:
        type:
          type: string
          const: function_call
        call_id:
          type: string
        name:
          type: string
        arguments:
          type: string
    ResponsesFunctionCallOutputInputItem:
      type: object
      required: [type, call_id, output]
      properties:
        type:
          type: string
          const: function_call_output
        call_id:
          type: string
        output:
          oneOf:
            - type: string
            - type: array
              items:
                type: object
                properties:
                  type:
                    type: string
                  text:
                    type: string
    ResponsesAPIResponse:
      type: object
      required:
        - id
        - object
        - status
        - model
        - output
      properties:
        id:
          type: string
        object:
          type: string
        status:
          type: string
        model:
          type: string
        output:
          type: array
          items:
            type: object
    AdminUser:
      type: object
      required:
        - id
        - org_id
        - email
        - role
        - is_active
        - created_at
        - updated_at
      properties:
        id:
          type: string
        org_id:
          type: string
        team_id:
          type: string
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [platform_admin, org_admin, team_admin, developer, service_account, viewer]
        oidc_subject:
          type: string
        max_budget_micros:
          type: integer
          format: int64
        soft_budget_micros:
          type: integer
          format: int64
        throttle_on_budget_exceeded:
          type: boolean
        budget_fallbacks:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        spent_micros:
          type: integer
          format: int64
        budget_reset_period:
          type: string
        budget_reset_at:
          type: string
          format: date-time
        rpm_limit:
          type: integer
        tpm_limit:
          type: integer
        max_concurrent_requests:
          type: integer
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    OrgProviderSubscription:
      type: object
      required:
        - org_id
        - provider
        - is_enabled
        - auto_enable_new
        - subscribed_at
      properties:
        org_id:
          type: string
        provider:
          type: string
          description: Provider identifier (e.g. openai, anthropic, gemini)
        is_enabled:
          type: boolean
          description: Whether the organization is entitled to route traffic to this provider
        auto_enable_new:
          type: boolean
          description: Automatically enable newly discovered models for this provider
        subscribed_at:
          type: string
          format: date-time
    OrgModelPolicy:
      type: object
      required:
        - org_id
        - global_model_id
        - is_enabled
        - approved_by
        - approved_at
      properties:
        org_id:
          type: string
        global_model_id:
          type: string
          description: Unique global model identifier (e.g. openai/gpt-4.1)
        is_enabled:
          type: boolean
          description: Whether tenant users/keys are permitted to invoke this model
        approved_by:
          type: string
          description: Identity of administrator who approved this model policy
        approved_at:
          type: string
          format: date-time
    AdminDeployment:
      type: object
      required:
        - id
        - model_group_id
        - global_model_id
        - priority
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: string
        model_group_id:
          type: string
        global_model_id:
          type: string
        credential_id:
          type: string
        deployment_name:
          type: string
        region:
          type: string
        weight:
          type: integer
        rpm_capacity:
          type: integer
        tpm_capacity:
          type: integer
        timeout_ms:
          type: integer
        priority:
          type: integer
        tags:
          type: array
          items:
            type: string
        max_budget_micros:
          type: integer
          format: int64
        budget_reset_period:
          type: string
        status:
          type: string
          enum: [active, cooldown, disabled]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    GuardrailSimulateRequest:
      type: object
      properties:
        prompt:
          type: string
        input:
          type: string
        text:
          type: string
        texts:
          type: array
          items:
            type: string
        messages:
          type: array
          items:
            type: object
            additionalProperties: true
        tools:
          type: array
          items:
            type: object
            additionalProperties: true
        tool_calls:
          type: array
          items:
            type: object
            additionalProperties: true
        tags:
          type: array
          items:
            type: string
        direction:
          type: string
          enum: [input, output]
        guardrail_name:
          type: string
        stream_chunk_size:
          type: integer
        policy:
          $ref: '#/components/schemas/GuardrailPolicy'
    GuardrailPolicy:
      type: object
      properties:
        org_id:
          type: string
        mode:
          type: string
          enum: [enforce, logging_only]
        scan_all_roles:
          type: boolean
        enable_prompt_injection:
          type: boolean
        prompt_injection_action:
          type: string
          enum: [block, redact, audit]
        enable_pii_detection:
          type: boolean
        pii_action:
          type: string
          enum: [block, redact, audit]
        enable_secret_detection:
          type: boolean
        secret_action:
          type: string
          enum: [block, redact, audit]
        blocked_keywords:
          type: array
          items:
            type: string
        redact_output_pii:
          type: boolean
        enable_toxicity_filter:
          type: boolean
        toxicity_action:
          type: string
          enum: [block, redact, audit]
        toxicity_threshold:
          type: string
          enum: [low, medium, high]
        enabled_content_categories:
          type: array
          items:
            type: string
        content_exceptions:
          type: array
          items:
            type: string
        updated_at:
          type: string
          format: date-time
    GuardrailSimulateResponse:
      type: object
      properties:
        allowed:
          type: boolean
        blocked:
          type: boolean
        decision:
          type: string
        action:
          type: string
        applied_action:
          type: string
        direction:
          type: string
        violations:
          type: array
          items: {}
        redacted:
          type: boolean
        redacted_prompt:
          type: string
        texts:
          type: array
          items:
            type: string
        modified_texts:
          type: array
          items:
            type: string
        modified_messages:
          type: array
          items:
            type: object
            additionalProperties: true
        modified_tool_calls:
          type: array
          items:
            type: object
            additionalProperties: true
        applied_guardrails:
          type: array
          items:
            type: string
        stream_chunks_evaluated:
          type: integer
        error_message:
          type: string
    CredentialValidateRequest:
      type: object
      required:
        - provider
      properties:
        provider:
          type: string
        api_key:
          type: string
          description: Required for providers that use API keys; may be omitted for Ollama.
        base_url:
          type: string
        azure_deployment_name:
          type: string
        api_version:
          type: string
        headers:
          type: object
          additionalProperties:
            type: string
    CredentialValidateResponse:
      type: object
      properties:
        valid:
          type: boolean
        provider:
          type: string
        validation_status:
          type: string
        error:
          type: string
        latency_ms:
          type: integer
          format: int64
        discovered_models:
          type: integer
    AdminTeam:
      type: object
      required:
        - id
        - org_id
        - name
        - is_active
        - created_at
        - updated_at
      properties:
        id:
          type: string
        org_id:
          type: string
        name:
          type: string
        max_budget_micros:
          type: integer
          format: int64
        soft_budget_micros:
          type: integer
          format: int64
        throttle_on_budget_exceeded:
          type: boolean
        budget_fallbacks:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        spent_micros:
          type: integer
          format: int64
        budget_reset_period:
          type: string
        budget_reset_at:
          type: string
          format: date-time
        rpm_limit:
          type: integer
        tpm_limit:
          type: integer
        max_concurrent_requests:
          type: integer
        allowed_models:
          type: array
          items:
            type: string
        allowed_mcp_servers:
          type: array
          items:
            type: string
        allowed_a2a_agents:
          type: array
          items:
            type: string
        allowed_client_apps:
          type: array
          items:
            type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AdminVirtualKey:
      type: object
      required:
        - id
        - key_prefix
        - name
        - org_id
        - role
        - is_active
        - created_at
        - updated_at
      properties:
        id:
          type: string
        key_prefix:
          type: string
        raw_key:
          type: string
          description: Populated once upon key creation or rotation
        name:
          type: string
        org_id:
          type: string
        team_id:
          type: string
        user_id:
          type: string
        role:
          type: string
          enum: [platform_admin, org_admin, org_viewer, team_admin, developer, service_account, viewer]
        allowed_models:
          type: array
          items:
            type: string
        allowed_endpoints:
          type: array
          items:
            type: string
        allowed_mcp_servers:
          type: array
          items:
            type: string
        allowed_a2a_agents:
          type: array
          items:
            type: string
        allowed_client_apps:
          type: array
          items:
            type: string
        max_budget_micros:
          type: integer
          format: int64
        soft_budget_micros:
