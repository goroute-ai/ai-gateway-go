      summary: Retrieve gateway observability metrics snapshot
      responses:
        '200':
          description: Observability metrics snapshot
          content:
            application/json:
              schema:
                type: object
                properties:
                  otel_enabled:
                    type: boolean
                    description: Whether OpenTelemetry OTLP/HTTP telemetry export is enabled.
                  otel_signals:
                    type: array
                    items:
                      type: string
                      enum: [traces, metrics, logs]
                    description: Active OTLP/HTTP telemetry signals exporting from this gateway instance.
                  redis_cb_state:
                    type: integer
                    description: Primary Redis circuit breaker state (0=closed, 1=half_open, 2=open).
                  routing_signal_degraded_total:
                    type: integer
                    format: int64
                    description: Routing operations degraded to process-local signals due to Redis unavailability.
                  finops_outbox_pending:
                    type: integer
                    format: int64
                    description: Current pending FinOps spend outbox queue depth.
                  finops_outbox_dead_letter:
                    type: integer
                    format: int64
                    description: Cumulative FinOps spend events moved to dead-letter state.
                  finops_outbox_backpressure:
                    type: integer
                    format: int64
                    description: Cumulative FinOps spend outbox backpressure rejections.
                  audit_siem_delivered:
                    type: integer
                    format: int64
                    description: Cumulative audit log events delivered to the SIEM webhook sink.
                  audit_siem_failed:
                    type: integer
                    format: int64
                    description: Cumulative audit log events that failed SIEM webhook delivery.
                  audit_siem_dropped:
                    type: integer
                    format: int64
                    description: Cumulative audit log events dropped due to a full SIEM webhook queue.
                  cache_enabled:
                    type: boolean
                    description: Whether response caching is enabled on this gateway instance.
                  cache_type:
                    type: string
                    enum: [local, redis, redis-semantic]
                    description: Active single-backend response cache mode.
                  cache_status:
                    type: string
                    enum: [ok, degraded, disabled]
                    description: Live health status of the active response cache backend.
                  cache_hits:
                    type: integer
                    format: int64
                    description: Authoritative eligible response cache hits (exact and semantic).
                  cache_misses:
                    type: integer
                    format: int64
                    description: Authoritative eligible response cache misses.
                  cache_semantic_hits:
                    type: integer
                    format: int64
                    description: Subset of response cache hits served via Redis semantic vector similarity search.
                  cache_errors:
                    type: integer
                    format: int64
                    description: Total fail-open response cache backend or embedding errors.
                  cache_entries:
                    type: integer
                    format: int64
                    description: Current in-memory entry count (local mode).
                  cache_evictions:
                    type: integer
                    format: int64
                    description: Total LRU evictions (local mode).
                  cache_hit_rate:
                    type: number
                    format: double
                    description: Ratio of eligible response cache hits to total eligible cache lookups (0..1).
                additionalProperties: true
