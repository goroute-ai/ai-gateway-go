# ==============================================================================
# GoRoute AI Gateway — Production Configuration Template
# ==============================================================================
# Copy this file to configs/config.yaml or supply its path via -config flag:
#   /app/ai-gateway -config /etc/goroute/config.yaml
#
# Environment variables override YAML values. Use os.environ/VAR syntax for
# secret substitution (e.g. os.environ/OPENAI_API_KEY).
# ==============================================================================

server:
  environment: "production"  # "development", "staging", or "production"
  public_base_url: "https://gateway.example.com" # Canonical external origin for OIDC redirect/logout & CLI URLs
  host: "0.0.0.0"
  port: 8080
  grpc_port: 0               # Optional A2A gRPC server port (0 = disabled, e.g. 9090)
  read_timeout: 30s
  write_timeout: 300s
  idle_timeout: 120s
  shutdown_timeout: 15s
  cors_allowed_origins: []   # Keep [] for same-origin BFF UI; production rejects "*", "null", and http:// origins (override: GATEWAY_CORS_ALLOWED_ORIGINS)
  cors_allow_credentials: false
  enable_hsts: false
  max_file_storage_bytes_per_org: 5368709120 # Max per-org file storage quota in bytes (default 5 GiB; 0 = unlimited)
  max_concurrent_file_uploads: 8             # Max concurrent /v1/files uploads per instance (default 8; 0 = unlimited)

logging:
  level: "info"              # "debug", "info", "warn", "error"
  format: "json"             # "json" for structured production logging, "text" for local dev
  add_source: false          # Attach source file and line number to log entries

# OpenTelemetry (OTLP/HTTP) — the sole telemetry export protocol supported in v0.1 LTS.
# Exports Traces, Metrics, and opt-in post-scrub Logs using GenAI Semantic Conventions (gen_ai.*) and dot-separated gateway.* metrics.
# Connect any external observability platform on top of OTLP/HTTP (directly or via an OpenTelemetry Collector).
otel:
  enabled: false             # Enable OTLP/HTTP telemetry export (env: GATEWAY_OTEL_ENABLED)
  endpoint: ""               # Base OTLP/HTTP collector URL, e.g. https://otel-collector:4318 (env: OTEL_EXPORTER_OTLP_ENDPOINT / GATEWAY_OTEL_ENDPOINT)
  service_name: "ai-gateway-go"
  headers: {}                # Optional exporter headers; supports os.environ/NAME secret refs
  traces:
    enabled: true            # Export OTLP /v1/traces when otel.enabled is true
    sampler: "parentbased_always_on" # always_on | always_off | traceidratio | parentbased_always_on | parentbased_always_off | parentbased_traceidratio
    sampler_arg: 1.0         # Ratio in [0.0, 1.0] for traceidratio samplers
    capture_content: false   # Privacy-first default: never export raw prompts/completions on spans unless explicitly enabled
  metrics:
    enabled: true            # Export OTLP /v1/metrics when otel.enabled is true
    export_interval: 60s     # Periodic push interval (env: OTEL_METRIC_EXPORT_INTERVAL in ms or GATEWAY_OTEL_METRICS_EXPORT_INTERVAL)
  logs:
    enabled: false           # Opt-in OTLP /v1/logs export via otelslog (always runs strictly AFTER secret/PII scrubbing)

health:
  probe_enabled: true        # Active background upstream deployment ListModels liveness probe
  probe_interval: 60s
  probe_timeout: 5s

audit:
  siem_webhook:
    enabled: false           # Async batched HMAC-SHA256 signed audit log export (env: GATEWAY_AUDIT_SIEM_*)
    url: ""                  # HTTPS SIEM webhook endpoint (SSRF-protected)
    secret: ""               # Optional HMAC-SHA256 signing secret (supports os.environ/...)
    auth_header: ""          # Optional Authorization header (supports os.environ/...)
    batch_size: 50
    flush_interval: 5s
    timeout: 5s
    max_queue_size: 4096

storage:
  mode: "postgres"           # "postgres" (recommended for production) or "memory"
  postgres_dsn: "postgres://gateway:STRONG_DB_PASSWORD@postgres-host:5432/aigateway?sslmode=require"
  rds_iam:
    enabled: false
    region: ""               # RDS AWS region. Use a DSN with sslmode=verify-full.
    # access_key_id: "os.environ/AWS_ACCESS_KEY_ID"
    # secret_access_key: "os.environ/AWS_SECRET_ACCESS_KEY"
    # role_arn: "os.environ/AWS_ROLE_ARN"
    # web_identity_token_file: "os.environ/AWS_WEB_IDENTITY_TOKEN_FILE"
  redis_addr: "redis-host:6379"
  redis_addrs: []            # Optional list of Redis Cluster / Sentinel seed addresses (overrides redis_addr when non-empty)
  redis_master_name: ""      # Optional Redis Sentinel master name
  redis_pass: ""             # Optional Redis authentication password (or os.environ/REDIS_PASSWORD)
  redis_db: 0

auth:
  # Master keys must be securely generated (e.g. openssl rand -hex 32)
  master_admin_key: "os.environ/GATEWAY_MASTER_ADMIN_KEY"
  master_encryption_key: "os.environ/GATEWAY_MASTER_ENCRYPTION_KEY" # 64-char hex string (32-byte AES-256 key)
  # Previous Master KEKs accepted for zero-downtime rolling restarts after /admin/v1/security/rotate-kek:
  # previous_master_encryption_keys:
  #   - "os.environ/GATEWAY_PREVIOUS_MASTER_ENCRYPTION_KEY"
  allow_master_key_data_plane: false
  allow_ambient_cloud_iam: false
  enable_data_plane_jwt: false       # Allow OIDC/JWT bearer auth on /v1/* data plane routes
  custom_api_key_header: ""          # Optional custom header name overriding default virtual key extraction order
  require_client_app_header: false       # Require X-Gateway-Client-App on all non-master Data Plane requests (explicit non-wildcard allowlists always require it)
  allow_viewer_control_plane_read: false # Legacy opt-in mapping role "viewer" to Control Plane org_viewer read-only access
  # Secure delivery or an in-process KeySecretSink is required to activate scheduled replacement keys.
  # key_rotation_delivery_url: "https://secrets.example.com/goroute/key-rotation"
  # key_rotation_delivery_token: "os.environ/GATEWAY_KEY_ROTATION_DELIVERY_TOKEN"
  # Declarative secret-manager sink ("webhook" | "vault_kv2"):
  # key_rotation_sink:
  #   driver: "vault_kv2"
  #   address: "https://vault.example.com:8200"
  #   mount: "secret"
  #   path_prefix: "goroute/virtual-keys"
  #   namespace: ""
  #   token: "os.environ/VAULT_TOKEN"
  key_rotation_poll_interval: 1m
  key_rotation_grace_period: 24h
  key_expiry_alert_poll_interval: 15m
  # Inbound JWT / OIDC Bearer authentication (Data Plane & Control Plane)
  # Note: Symmetric HS* JWT verification is disabled; all OIDC issuers must use asymmetric JWKS / Discovery.
  jwt_issuer: ""
  jwt_audience: ""
  oidc_jwks_url: ""
  oidc_issuers: []
  #  - issuer: "https://keycloak.example.com/realms/goroute"
  #    audience: "goroute-gateway"   # Required to prevent cross-client token replay
  #    jwks_url: "https://keycloak.example.com/realms/goroute/protocol/openid-connect/certs"
  #    discovery_url: "https://keycloak.example.com/realms/goroute/.well-known/openid-configuration"
  #    algorithms: ["RS256", "PS256", "ES256", "EdDSA"]
  #    allowed_email_domains: ["example.com"]
  #    allow_unverified_email: false # Require email_verified == true for domain checks & JIT email matching
  #    allow_privileged_role_claims: false # Keep false unless IdP role claim is authorized to JIT platform_admin
  #    auto_register: false
  #    default_org_id: "org_default"
  #    default_team_id: ""
  #    default_role: "developer"
  #    claim_mapping:
  #      user_id: "sub"
  #      email: "email"
  #      org_id: "org_id"
  #      team_ids: "groups"
  #      role: "role"
  #      end_user: "end_user_id"
  # Control Plane OIDC Authorization Code + PKCE SSO providers
  sso_providers: []
  #  - id: "keycloak"
  #    name: "Keycloak SSO"
  #    type: "oidc"                   # Only open standard "oidc" is supported
  #    display_name: "Sign in with Keycloak"
  #    client_id: "os.environ/SSO_KEYCLOAK_CLIENT_ID"
  #    client_secret: "os.environ/SSO_KEYCLOAK_CLIENT_SECRET"
  #    issuer: "https://keycloak.example.com/realms/goroute"
  #    discovery_url: "https://keycloak.example.com/realms/goroute/.well-known/openid-configuration"
  #    redirect_url: "https://gateway.example.com/auth/sso/keycloak/callback"
  #    scopes: ["openid", "profile", "email"]
  #    algorithms: ["RS256", "ES256", "EdDSA"]
  #    allowed_email_domains: ["example.com"]
  #    allow_unverified_email: false
  #    allow_privileged_role_claims: false
  #    auto_register: true
  #    default_org_id: "org_default"
  #    default_role: "org_viewer"
  #    claim_mapping:
  #      groups: "realm_access.roles"
  #    group_role_mappings:
  #      - group: "goroute-org-admins"
  #        role: "org_admin"
  #      - group: "goroute-developers"
  #        role: "developer"
  #    role_mapping_strategy: "highest_privilege" # or "first_match"
  #    group_team_mappings:
  #      eng-ml: "team_ml"
  #    sync_roles_on_login: false     # When true, synchronizes role/team on every SSO login and revokes prior sessions on role change
  # Optional standalone external post-auth authorizer (Webhook or OPA Data API, SSRF-protected)
  external_authorizer:
    enabled: false
    # mode: "webhook"                # "webhook" or "opa"
    # url: "https://policy.internal.example.com/v1/authorize"
    # timeout: 500ms
    # fail_mode: "closed"            # "closed" (recommended) or "open"
    # cache_ttl: 5s
    # auth_header: "os.environ/POLICY_AUTH_HEADER"
    # hmac_secret: "os.environ/POLICY_HMAC_SECRET"
  # OAuth 2.0 RFC 7662 Token Introspection / OIDC UserInfo (supports OIDC Discovery via issuer/discovery_url)
  introspection: {}
  #  issuer: "https://keycloak.example.com/realms/goroute"
  #  audience: "goroute-gateway"
  #  discovery_url: "https://keycloak.example.com/realms/goroute/.well-known/openid-configuration"
