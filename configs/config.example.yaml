# ==============================================================================
# GoRoute AI Gateway — Production Configuration Template
# ==============================================================================
# Copy this file to configs/config.yaml or supply its path via -config flag:
#   /app/ai-gateway -config /etc/goroute/config.yaml
#
# Environment variables override YAML values. Use os.environ/VAR syntax for
# secret substitution (e.g. os.environ/OPENAI_API_KEY).
# ==============================================================================

server:
  environment: "production"  # "development", "staging", or "production"
  host: "0.0.0.0"
  port: 8080
  grpc_port: 0               # Optional A2A gRPC server port (0 = disabled, e.g. 9090)
  read_timeout: 30s
  write_timeout: 300s
  idle_timeout: 120s
  shutdown_timeout: 15s
  cors_allowed_origins: []
  cors_allow_credentials: false
  enable_hsts: false
  max_file_storage_bytes_per_org: 5368709120 # Max per-org file storage quota in bytes (default 5 GiB; 0 = unlimited)
  max_concurrent_file_uploads: 8             # Max concurrent /v1/files uploads per instance (default 8; 0 = unlimited)

logging:
  level: "info"              # "debug", "info", "warn", "error"
  format: "json"             # "json" for structured production logging, "text" for local dev
  add_source: false          # Attach source file and line number to log entries

tracing:
  enabled: false             # Enable OpenTelemetry distributed tracing and OTLP metrics export
  otlp_endpoint: ""          # Optional OTLP/HTTP endpoint, for example https://otel-collector:4318/v1/traces
  service_name: "ai-gateway-go"
  headers: {}                # Optional exporter headers, use os.environ/NAME for secret values

storage:
  mode: "postgres"           # "postgres" (recommended for production) or "memory"
  postgres_dsn: "postgres://gateway:STRONG_DB_PASSWORD@postgres-host:5432/aigateway?sslmode=require"
  rds_iam:
    enabled: false
    region: ""               # RDS AWS region. Use a DSN with sslmode=verify-full.
    # access_key_id: "os.environ/AWS_ACCESS_KEY_ID"
    # secret_access_key: "os.environ/AWS_SECRET_ACCESS_KEY"
    # role_arn: "os.environ/AWS_ROLE_ARN"
    # web_identity_token_file: "os.environ/AWS_WEB_IDENTITY_TOKEN_FILE"
  redis_addr: "redis-host:6379"
  redis_addrs: []            # Optional list of Redis Cluster / Sentinel seed addresses (overrides redis_addr when non-empty)
  redis_master_name: ""      # Optional Redis Sentinel master name
  redis_pass: ""             # Optional Redis authentication password (or os.environ/REDIS_PASSWORD)
  redis_db: 0

auth:
  # Master keys must be securely generated (e.g. openssl rand -hex 32)
  master_admin_key: "os.environ/GATEWAY_MASTER_ADMIN_KEY"
  master_encryption_key: "os.environ/GATEWAY_MASTER_ENCRYPTION_KEY" # 64-char hex string (32-byte AES-256 key)
  # Previous Master KEKs accepted for zero-downtime rolling restarts after /admin/v1/security/rotate-kek:
  # previous_master_encryption_keys:
  #   - "os.environ/GATEWAY_PREVIOUS_MASTER_ENCRYPTION_KEY"
  allow_master_key_data_plane: false
  allow_ambient_cloud_iam: false
  enable_data_plane_jwt: false       # Allow OIDC/JWT bearer auth on /v1/* data plane routes
  custom_api_key_header: ""          # Optional custom header name overriding default virtual key extraction order
  # Secure delivery or an in-process KeySecretSink is required to activate scheduled replacement keys.
  # key_rotation_delivery_url: "https://secrets.example.com/goroute/key-rotation"
  # key_rotation_delivery_token: "os.environ/GATEWAY_KEY_ROTATION_DELIVERY_TOKEN"
  # Declarative secret-manager sink ("webhook" | "vault_kv2"):
  # key_rotation_sink:
  #   driver: "vault_kv2"
  #   address: "https://vault.example.com:8200"
  #   mount: "secret"
  #   path_prefix: "goroute/virtual-keys"
  #   namespace: ""
  #   token: "os.environ/VAULT_TOKEN"
  key_rotation_poll_interval: 1m
  key_rotation_grace_period: 24h
  key_expiry_alert_poll_interval: 15m
  jwt_secret: "os.environ/GATEWAY_JWT_SECRET"
  jwt_issuer: ""
  jwt_audience: ""
  oidc_jwks_url: ""
  oidc_issuers: []
  #  - issuer: "https://idp.example.com/oauth2/default"
  #    audience: "goroute-gateway"
  #    jwks_url: "https://idp.example.com/oauth2/default/v1/keys"
  #    discovery_url: "https://idp.example.com/oauth2/default/.well-known/openid-configuration"
  #    algorithms: ["RS256", "ES256"]
  #    allowed_email_domains: ["example.com"]
  #    auto_register: false
  #    default_org_id: "org_default"
  #    default_team_id: ""
  #    default_role: "developer"
  #    claim_mapping:
  #      user_id: "sub"
  #      email: "email"
  #      org_id: "org_id"
  #      team_ids: "groups"
  #      role: "role"
  #      end_user: "end_user_id"
  sso_providers: []
  #  - id: "okta"
  #    name: "Okta Workforce SSO"
  #    type: "oidc"
  #    display_name: "Sign in with Okta"
  #    client_id: "os.environ/SSO_OKTA_CLIENT_ID"
  #    client_secret: "os.environ/SSO_OKTA_CLIENT_SECRET"
  #    issuer: "https://idp.example.com/oauth2/default"
  #    redirect_url: "https://gateway.example.com/auth/sso/okta/callback"
  #    scopes: ["openid", "profile", "email"]
  #    allowed_email_domains: ["example.com"]
  #    auto_register: false
  #    default_org_id: "org_default"
  #    default_role: "org_viewer"
  introspection: {}
  #  token_info_endpoint: "https://idp.example.com/oauth2/v1/introspect"
  #  client_id: "os.environ/INTROSPECT_CLIENT_ID"
  #  client_secret: "os.environ/INTROSPECT_CLIENT_SECRET"
  #  mode: "introspection"            # "introspection" (RFC 7662) or "userinfo"
  #  cache_ttl: 5m
  proxy_auth:
    enabled: false
    trusted_proxy_cidrs: []          # e.g. ["10.0.0.0/8"]
    header_mapping: {}
    #  user_id: "X-Auth-Request-User"
    #  email: "X-Auth-Request-Email"
    #  org_id: "X-Auth-Request-Org"
    #  role: "X-Auth-Request-Role"
  ui_username: ""                    # Optional password-login operator username
  ui_password: ""                    # Optional password-login operator password (or os.environ/GATEWAY_UI_PASSWORD)
  session_secret: "os.environ/GATEWAY_SESSION_SECRET" # HMAC secret for operator goroute_session cookies
  session_ttl: 24h
  enable_hibp_check: false           # k-anonymity SHA-1 prefix breached password check
  hibp_base_url: ""                  # Optional override for Pwned Passwords range API base URL
  default_org_id: "org_default"
  default_virtual_key: "os.environ/GATEWAY_DEFAULT_KEY"
  l1_cache_ttl: 15s
  l2_cache_ttl: 5m
  key_rotation_poll_interval: 1m
  key_rotation_grace_period: 24h
  key_expiry_alert_poll_interval: 1h
  session_secret: "os.environ/GATEWAY_SESSION_SECRET"
  session_ttl: 12h
  enable_hibp_check: false

router:
  default_fast_alias: "fast"
  default_reasoning_alias: "reasoning"
  default_coding_alias: "coding"
  complexity_threshold: 0.40
  long_context_tokens: 32000
  default_max_retries: 2
  base_retry_delay: 50ms
  max_retry_delay: 2s
  default_cooldown: 60s
  failure_window: 30s
  failure_threshold: 3
  max_fallback_depth: 16
  default_fallbacks: []
  #  - target: "fast-backup"
  #    overrides:
  #      temperature: 0.2
  retry_policy: {}
  #  rate_limit_retries: 2
  #  timeout_retries: 1
  #  server_error_retries: 2
  #  auth_error_retries: 1
  #  not_found_retries: 0
  #  bad_request_retries: 0
  #  default_retries: 1
  cooldown_policy: {}
  #  allowed_fails:
  #    rate_limit: 5
  #    server_error: 3
  #    auth: 1
  #  failure_rate_threshold: 0.5
  #  min_requests_per_minute: 10
  #  max_cooldown_seconds: 300
  enable_mid_stream_continuation: false
  max_stream_continuations: 1
  health_staleness_threshold: 0s     # 0s = disable health staleness check
  strict_capacity_filtering: false   # Exclude deployments with exhausted local RPM/TPM capacity windows
  provider_budgets: {}               # Optional per-provider budget cap in micro-USD (e.g. openai: 100000000)
  session_affinity_ttl: 30m
  session_affinity_repin_on_failover: true
  prompt_cache_affinity: false
  pre_router_mode: ""                # "", "heuristic", "semantic", "quality", or "adaptive"
  semantic_router:
    enabled: false
    embedding_model: ""
    similarity_threshold: 0.78
    timeout: 2s
    routes: []
    #  - name: "coding-intent"
    #    target_model: "coding"
    #    description: "Software engineering, debugging, and code generation"
    #    utterances:
    #      - "Write a Go function to parse JSON"
    #      - "Debug this failing SQL query"
  cache_aware_routing: false
  bandit:
    enabled: false
    default_alpha: 1.0
    default_beta: 1.0
    exploration_rate: 0.1
    decay_half_life: 24h
    latency_weight: 0.5
    cost_weight: 0.5
    sync_interval: 5s
    candidate_models: []
    #  - "fast"
    #  - "reasoning"
    #  - "coding"
  hedge_delay_ms: 0                  # 0 = disabled; >0 enables staggered hedged racing
  max_hedge_concurrency: 2
  scheduler:
    enabled: false
    max_queue_depth: 256
    max_wait_time: 5s
    default_priority: 0
    max_parallel_wait_ms: 0          # Bounded wait (ms) when all candidate deployments hit max_parallel_requests
  priority_capacity:
    enabled: false
    saturation_threshold: 0.85
    active_caller_ttl: 5m
    window_duration: 1m
    default_weight: 1.0
    default_borrow_multiple: 2.0
  latency_tolerance_pct: 0.0         # Optional band above fastest EWMA deployment for latency-based load balancing
  max_honored_retry_after: 60s       # Upper bound on upstream Retry-After waits before failing over
  disable_cooldowns: false           # Disable circuit breaker cooldown tripping globally
  fallback_on_saturation: false      # Allow falling back when capacity/concurrency/priority saturation occurs
  drop_unsupported_params: false     # Strip unsupported capabilities/params instead of rejecting requests
  fallback_on_unsupported_params: false # Fall back on upstream unsupported-parameter errors without cooldown tripping
  allow_strategy_override: false     # Allow per-request X-Gateway-Routing-Strategy / goroute_extensions overrides
  debug_routing_headers: false       # Allow opt-in redacted X-Gateway-Fallback-Errors when caller sends X-Gateway-Debug-Routing: true

rate_limit:
  enabled: true
  fallback_to_local_on_outage: false # Degrade to in-memory rate-limit/budget tracking if Redis is unreachable (default false = fail-closed)
  window_seconds: 60
  concurrency_ttl_sec: 300           # Lease TTL (s) for concurrent request slots and max_parallel_requests ZSET leases
  default_estimated_tpm: 128
  redis_timeout: 50ms
  global_rpm_limit: 0
  global_tpm_limit: 0
  global_max_concurrent: 0
  default_agent_session_max_iterations: 0
  default_agent_session_max_budget_micros: 0
  default_agent_session_ttl_sec: 0
  dynamic_on_upstream_429: false     # Optional brief per-key soft cooldown after upstream 429 rate-limits

finops:
  channel_buffer_size: 16384
  batch_size: 250
  flush_interval: 500ms
  worker_count: 4
  soft_budget_webhook_url: ""
  soft_budget_cooldown_sec: 3600
  budget_exceeded_throttle_pct: 0.10

discovery:
  enabled: true
  sync_interval: 6h
  auto_approve: false        # Require admin approval for newly discovered upstream models

cache:
  enabled: true
  default_ttl: 1h
  max_l1_entries: 4096

