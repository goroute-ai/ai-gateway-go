# ------------------------------------------------------------------------------
# Security & Network Egress (SSRF Hardening)
# ------------------------------------------------------------------------------
security:
  network:
    outbound_ssrf:
      # In production, private networks and insecure HTTP must be disabled
      allow_private_networks: false
      allowed_private_cidrs: []   # Targeted VPC CIDRs only (e.g. ["10.20.0.0/16"]); production rejects < /8 (IPv4), < /7 (IPv6), loopback, link-local, and IMDS ranges (override: GATEWAY_SECURITY_SSRF_ALLOWED_PRIVATE_CIDRS)
      allow_insecure_http: false   # Strict HTTPS enforcement (enabling restricts custom credential base_url overrides to platform_admin)
      allow_loopback_http: false   # Set true in local dev ONLY to allow http://localhost|127.0.0.1|::1 (e.g. Keycloak dev server) without opening private RFC 1918 networks; restricts custom credential base_url overrides to platform_admin
      allowed_schemes: ["https"]
      blocked_ips:
        - "169.254.169.254"       # Cloud metadata service protection
        - "fd00:ec2::254"         # AWS IPv6 metadata
      dial_timeout: 10s
      max_redirects: 3
      egress_proxy_url: ""        # Optional corporate HTTP/HTTPS egress proxy URL
    inbound_caller:
      expose_on_public_internet: false
      allowed_client_cidrs: []
      trusted_proxy_cidrs: []

# ------------------------------------------------------------------------------
# Model Context Protocol (MCP) Configuration
# ------------------------------------------------------------------------------
mcp:
  enabled: true
  allow_stdio_servers: false       # Fail-closed: stdio subprocesses disabled
  allowed_stdio_binaries: []       # Allowlist of canonical binary paths when stdio is enabled
  enable_session_compat_2025: true # Enable 2025-11-25 stateful compatibility adapter
  session_ttl_2025: 15m
  cache_key_secret: ""             # Optional HMAC secret for delimiter-collision-proof cache keys
  max_payload_bytes: 10485760      # 10 MB payload limit
  default_timeout: 30s
  subscriptions_listen_active: true

# ------------------------------------------------------------------------------
# Agent-to-Agent (A2A v1.0) Configuration
# ------------------------------------------------------------------------------
a2a:
  enabled: true
  enable_jsonrpc: true
  enable_http_json: true
  enable_subscribe_post_compat: false # Canonical is GET /tasks/{id}:subscribe
  allow_legacy_card_discovery: false
  max_task_lifespan: 24h
  stream_buffer_capacity: 256
  stream_publish_interval: 50ms
  max_push_retries: 5
  signing_key_id: "gw-a2a-signer-v1"
  allowed_signing_algs:
    - "ES256"
    - "RS256"
    - "EdDSA"
  trusted_card_jwks: {}            # Upstream agent slug -> JWKS URL mapping

# ------------------------------------------------------------------------------
# Certified Custom OpenAI-Compatible Upstream Providers
# ------------------------------------------------------------------------------
providers:
  request_timeout: 2m          # Total deadline for non-streaming upstream requests
  response_header_timeout: 2m  # Maximum wait for upstream response headers / TTFT
  stream_idle_timeout: 2m      # Maximum gap between upstream stream chunks
  max_idle_conns: 256          # Retained idle provider connections across all hosts
  max_idle_conns_per_host: 16  # Retained idle connections per provider host

# ------------------------------------------------------------------------------
# Declarative Model List & Fallback Topologies
# ------------------------------------------------------------------------------
model_list:
  - model_name: fast
    routing_strategy: weighted-shuffle
    fallbacks: ["fast-backup"]
    # context_window_fallbacks:
    #   - target: "long-context"
    # content_policy_fallbacks:
    #   - target: "fast-backup"
    # fallback_targets:
    #   - target: "fast-backup"
    #     overrides:
    #       max_tokens: 2048
    # saturation_fallbacks:
    #   - target: "fast-backup"
    # drop_unsupported_params: false
    # disable_cooldowns: false
    model_params:
      model: groq/llama-3.1-8b-instant
      api_key: os.environ/GROQ_API_KEY
      weight: 100
      rpm: 1000
      tpm: 1000000
      # itpm: 500000
      # otpm: 500000
      # max_parallel_requests: 64
      # region: "us-east"
      # priority: 1
      # tags: ["tier:fast", "region:us"]
      # max_budget_micros: 0
      # budget_reset_period: "monthly"

  - model_name: fast-backup
    model_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY
      weight: 100

  - model_name: reasoning
    routing_strategy: least-busy
    fallbacks: ["reasoning-backup"]
    model_params:
      model: anthropic/claude-sonnet-4-20250514
      api_key: os.environ/ANTHROPIC_API_KEY
      weight: 100

  - model_name: reasoning-backup
    model_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY
      weight: 100

  - model_name: openrouter-sonnet
    model_params:
      model: openrouter/anthropic/claude-sonnet-4-5
      api_key: os.environ/OPENROUTER_API_KEY
      headers:
        HTTP-Referer: "https://goroute.example.com"
        X-Title: "GoRoute AI Gateway"
      weight: 100

  # Local Ollama (requires security.network.outbound_ssrf.allow_loopback_http: true; api_key is optional for local servers)
  # - model_name: local-qwen
  #   model_params:
  #     model: ollama/qwen2.5:0.5b
  #     api_base: http://127.0.0.1:11434
  #     weight: 100

  - model_name: gemini-flash
    model_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY
      weight: 100
