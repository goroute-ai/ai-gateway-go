server:
  host: "0.0.0.0"
  port: 8080
  read_timeout: 30s
  write_timeout: 300s
  idle_timeout: 120s
  shutdown_timeout: 15s

logging:
  level: "info"
  format: "text"
  add_source: false

storage:
  mode: "postgres"
  postgres_dsn: "postgres://gateway:gateway@localhost:5432/aigateway?sslmode=disable"
  redis_addr: "localhost:6379"
  redis_db: 0

auth:
  master_admin_key: "sk-gw-master-admin-default-key-change-me"
  master_encryption_key: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
  jwt_secret: "gateway-jwt-hmac-secret-change-me"
  default_org_id: "org_default"
  default_virtual_key: "sk-gw-master-admin-default-key-change-me"
  l1_cache_ttl: 15s
  l2_cache_ttl: 5m

router:
  default_fast_alias: "fast"
  default_reasoning_alias: "reasoning"
  default_coding_alias: "coding"
  complexity_threshold: 0.40
  long_context_tokens: 32000
  default_max_retries: 2
  base_retry_delay: 50ms
  max_retry_delay: 2s
  default_cooldown: 60s
  failure_window: 30s
  failure_threshold: 3

rate_limit:
  enabled: true
  window_seconds: 60
  concurrency_ttl_sec: 300
  default_estimated_tpm: 128
  redis_timeout: 50ms

finops:
  channel_buffer_size: 16384
  batch_size: 250
  flush_interval: 500ms
  worker_count: 2

discovery:
  enabled: true
  sync_interval: 6h
  auto_approve: true

cache:
  enabled: true
  default_ttl: 1h

security:
  network:
    outbound_ssrf:
      allow_private_networks: true # enabled for local loopback dev / demo
      allowed_private_cidrs:
        - "127.0.0.1/32"
        - "10.0.0.0/8"
      allow_insecure_http: true    # enabled for local demo upstreams (http://localhost:*)
      allowed_schemes: ["http", "https"]
      blocked_ips:
        - "169.254.169.254"
      dial_timeout: 10s
      max_redirects: 3
    inbound_caller:
      expose_on_public_internet: false
      allowed_client_cidrs: []

mcp:
  enabled: true
  allow_stdio_servers: false       # fail-closed: stdio disabled until BL-02 sandbox
  enable_session_compat_2025: true # enables 2025-11-25 streamable HTTP compat
  session_ttl_2025: 15m
  max_payload_bytes: 10485760      # 10MB
  default_timeout: 30s
  subscriptions_listen_active: true

a2a:
  enabled: true
  enable_jsonrpc: true
  enable_http_json: true
  enable_subscribe_post_compat: false # canonical is GET /tasks/{id}:subscribe
  allow_legacy_card_discovery: false
  max_task_lifespan: 24h
  stream_buffer_capacity: 256
  stream_publish_interval: 50ms
  max_push_retries: 5
  signing_key_id: "gw-a2a-signer-v1"
  allowed_signing_algs:
    - "ES256"
    - "RS256"
    - "EdDSA"

# Declarative Model List
model_list:
  - model_name: llama3.2:1b
    model_params:
      model: ollama/llama3.2:1b
      api_base: http://localhost:11434
  - model_name: fast
    routing_strategy: weighted-shuffle
    model_params:
      model: ollama/llama3.2:1b
      api_base: http://localhost:11434
      weight: 100
  - model_name: gpt-4o-mini
    model_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY
  - model_name: claude-haiku
    model_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: gemini-flash
    model_params:
      model: gemini/gemini-2.5-flash-lite
      api_key: os.environ/GEMINI_API_KEY
  - model_name: reasoning
    routing_strategy: least-busy
    model_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY
      weight: 100
  - model_name: failover-primary
    fallbacks: ["llama3.2:1b"]
    model_params:
      model: ollama/llama3.2:1b
      api_base: http://127.0.0.1:59999
      weight: 100
