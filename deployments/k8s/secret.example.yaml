# Copy and populate real secrets before deploying `deployments/k8s`:
#   kubectl create secret generic gateway-secrets -n goroute \
#     --from-literal=POSTGRES_PASSWORD=... \
#     --from-literal=GATEWAY_POSTGRES_DSN='postgres://gateway:...@postgres:5432/aigateway?sslmode=disable' \
#     --from-literal=GATEWAY_MASTER_ADMIN_KEY=... \
#     --from-literal=GATEWAY_MASTER_ENCRYPTION_KEY=... \
#     --from-literal=GATEWAY_JWT_SECRET=... \
#     --from-literal=GATEWAY_SESSION_SECRET=...
apiVersion: v1
kind: Secret
metadata:
  name: gateway-secrets
  namespace: goroute
type: Opaque
stringData:
  POSTGRES_PASSWORD: "<REPLACE_WITH_STRONG_DB_PASSWORD>"
  GATEWAY_POSTGRES_DSN: "postgres://gateway:<REPLACE_WITH_STRONG_DB_PASSWORD>@postgres:5432/aigateway?sslmode=disable"
  GATEWAY_MASTER_ADMIN_KEY: "<REPLACE_WITH_MIN_32_CHAR_ADMIN_KEY>"
  GATEWAY_MASTER_ENCRYPTION_KEY: "<REPLACE_WITH_64_HEX_CHAR_AES256_KEY>"
  GATEWAY_JWT_SECRET: "<REPLACE_WITH_MIN_32_CHAR_JWT_SECRET>"
  GATEWAY_SESSION_SECRET: "<REPLACE_WITH_MIN_32_CHAR_SESSION_SECRET>"
