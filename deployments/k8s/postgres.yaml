apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: goroute-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: gateway
            - name: POSTGRES_PASSWORD
              value: gateway
            - name: POSTGRES_DB
              value: aigateway_test
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "gateway", "-d", "aigateway_test"]
            initialDelaySeconds: 3
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: goroute-test
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
