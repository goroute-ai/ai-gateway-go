name: goroute-prod-test

networks:
  data-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.10.0/24
  edge-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.20.0/24
  upstream-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.10.0/24

services:
  postgres:
    image: postgres:16-alpine
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: aigateway_prod_test
    ports:
      - "25432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    networks:
      - data-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d aigateway_prod_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}", "--appendonly", "yes"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    ports:
      - "26379:6379"
    networks:
      - data-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  mock-upstream:
    image: goroute/mock-upstream:prod-test
    build:
      context: ..
      dockerfile: tests/fixtures/mock-upstream/Dockerfile
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ${GOROUTE_PROD_RUN_DIR:-/tmp/goroute-prod-test}/tls:/etc/goroute/tls:ro
    networks:
      upstream-net:
        ipv4_address: 172.29.10.20
    healthcheck:
      test: ["CMD", "/app/mock-upstream", "-healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 15

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./../deployments/otel/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
      - ${GOROUTE_PROD_RUN_DIR:-/tmp/goroute-prod-test}/tls:/etc/otel/tls:ro
    networks:
      upstream-net:
        ipv4_address: 172.29.10.30

  gateway-migrate:
    image: goroute/ai-gateway:prod-test
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    command: ["-config", "/etc/goroute/config.yaml", "-migrate-only"]
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      GATEWAY_ENV: "production"
      GATEWAY_POSTGRES_DSN: "postgres://gateway:${POSTGRES_PASSWORD}@postgres:5432/aigateway_prod_test?sslmode=disable"
      GATEWAY_REDIS_PASS: "${REDIS_PASSWORD}"
      GATEWAY_MASTER_ADMIN_KEY: "${GATEWAY_MASTER_ADMIN_KEY:?GATEWAY_MASTER_ADMIN_KEY must be set}"
      GATEWAY_MASTER_ENCRYPTION_KEY: "${GATEWAY_MASTER_ENCRYPTION_KEY:?GATEWAY_MASTER_ENCRYPTION_KEY must be set}"
      GATEWAY_JWT_SECRET: "${GATEWAY_JWT_SECRET:?GATEWAY_JWT_SECRET must be set}"
      SSL_CERT_FILE: "/etc/goroute/tls/ca-bundle.crt"
    volumes:
      - ./../configs/config.prod-test.yaml:/etc/goroute/config.yaml:ro
      - ${GOROUTE_PROD_RUN_DIR:-/tmp/goroute-prod-test}/tls:/etc/goroute/tls:ro
    networks:
      - data-net
      - upstream-net
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  ai-gateway-1:
    image: goroute/ai-gateway:prod-test
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    command: ["-config", "/etc/goroute/config.yaml"]
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cpus: "1.0"
    mem_limit: "512m"
    environment:
      GATEWAY_ENV: "production"
      GATEWAY_PORT: "8080"
      GATEWAY_POSTGRES_DSN: "postgres://gateway:${POSTGRES_PASSWORD}@postgres:5432/aigateway_prod_test?sslmode=disable"
      GATEWAY_REDIS_ADDR: "redis:6379"
      GATEWAY_REDIS_PASS: "${REDIS_PASSWORD}"
      GATEWAY_MASTER_ADMIN_KEY: "${GATEWAY_MASTER_ADMIN_KEY}"
      GATEWAY_MASTER_ENCRYPTION_KEY: "${GATEWAY_MASTER_ENCRYPTION_KEY}"
      GATEWAY_JWT_SECRET: "${GATEWAY_JWT_SECRET}"
      GATEWAY_JWT_ISSUER: "https://auth.goroute.local"
      GATEWAY_JWT_AUDIENCE: "goroute-gateway"
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: "https://otel-collector:4318/v1/metrics"
      SSL_CERT_FILE: "/etc/goroute/tls/ca-bundle.crt"
    volumes:
      - ./../configs/config.prod-test.yaml:/etc/goroute/config.yaml:ro
      - ${GOROUTE_PROD_RUN_DIR:-/tmp/goroute-prod-test}/tls:/etc/goroute/tls:ro
    networks:
      - data-net
      - edge-net
      - upstream-net
    depends_on:
      gateway-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mock-upstream:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "/app/ai-gateway", "-healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 20

  ai-gateway-2:
    image: goroute/ai-gateway:prod-test
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    command: ["-config", "/etc/goroute/config.yaml"]
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cpus: "1.0"
    mem_limit: "512m"
    environment:
      GATEWAY_ENV: "production"
      GATEWAY_PORT: "8080"
      GATEWAY_POSTGRES_DSN: "postgres://gateway:${POSTGRES_PASSWORD}@postgres:5432/aigateway_prod_test?sslmode=disable"
      GATEWAY_REDIS_ADDR: "redis:6379"
      GATEWAY_REDIS_PASS: "${REDIS_PASSWORD}"
      GATEWAY_MASTER_ADMIN_KEY: "${GATEWAY_MASTER_ADMIN_KEY}"
      GATEWAY_MASTER_ENCRYPTION_KEY: "${GATEWAY_MASTER_ENCRYPTION_KEY}"
      GATEWAY_JWT_SECRET: "${GATEWAY_JWT_SECRET}"
      GATEWAY_JWT_ISSUER: "https://auth.goroute.local"
      GATEWAY_JWT_AUDIENCE: "goroute-gateway"
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: "https://otel-collector:4318/v1/metrics"
      SSL_CERT_FILE: "/etc/goroute/tls/ca-bundle.crt"
    volumes:
      - ./../configs/config.prod-test.yaml:/etc/goroute/config.yaml:ro
      - ${GOROUTE_PROD_RUN_DIR:-/tmp/goroute-prod-test}/tls:/etc/goroute/tls:ro
    networks:
      - data-net
      - edge-net
      - upstream-net
    depends_on:
      gateway-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mock-upstream:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "/app/ai-gateway", "-healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 20

  nginx-lb:
    image: nginx:1.27-alpine
    ports:
      - "28080:8080"
      - "28443:8443"
    volumes:
      - ./../deployments/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${GOROUTE_PROD_RUN_DIR:-/tmp/goroute-prod-test}/tls:/etc/nginx/tls:ro
    networks:
      - edge-net
    depends_on:
      ai-gateway-1:
        condition: service_healthy
      ai-gateway-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null 2>&1"]
      interval: 2s
      timeout: 3s
      retries: 15

  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "19090:9090"
    volumes:
      - ./../deployments/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${GOROUTE_PROD_RUN_DIR:-/tmp/goroute-prod-test}/prom_token:/etc/prometheus/gateway_token:ro
    networks:
      - edge-net
    depends_on:
      ai-gateway-1:
        condition: service_healthy
      ai-gateway-2:
        condition: service_healthy
