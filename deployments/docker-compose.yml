services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
      POSTGRES_DB: aigateway
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d aigateway"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  gateway-migrate:
    # Prebuilt alternative (replace 'build:' with 'image:'):
    # image: qaadir/ai-gateway:1.23.0
    # image: ghcr.io/goroute-ai/ai-gateway-go:1.23.0
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    command: ["-config", "/app/configs/config.yaml", "-migrate-only"]
    environment:
      GATEWAY_ENV: "${GATEWAY_ENV:-development}"
      GATEWAY_POSTGRES_DSN: "postgres://gateway:gateway@postgres:5432/aigateway?sslmode=disable"
      GATEWAY_JWT_ISSUER: "${GATEWAY_JWT_ISSUER:-https://auth.goroute.local}"
      GATEWAY_JWT_AUDIENCE: "${GATEWAY_JWT_AUDIENCE:-goroute-gateway}"
      GATEWAY_MASTER_ADMIN_KEY: "${GATEWAY_MASTER_ADMIN_KEY:-sk-gw-master-admin-default-key-change-me}"
      GATEWAY_MASTER_ENCRYPTION_KEY: "${GATEWAY_MASTER_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  ai-gateway:
    # Prebuilt alternative (replace 'build:' with 'image:'):
    # image: qaadir/ai-gateway:1.23.0
    # image: ghcr.io/goroute-ai/ai-gateway-go:1.23.0
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    ports:
      - "8080:8080"
    environment:
      GATEWAY_ENV: "${GATEWAY_ENV:-development}"
      GATEWAY_PORT: "8080"
      GATEWAY_POSTGRES_DSN: "postgres://gateway:gateway@postgres:5432/aigateway?sslmode=disable"
      GATEWAY_REDIS_ADDR: "redis:6379"
      GATEWAY_JWT_ISSUER: "${GATEWAY_JWT_ISSUER:-https://auth.goroute.local}"
      GATEWAY_JWT_AUDIENCE: "${GATEWAY_JWT_AUDIENCE:-goroute-gateway}"
      GATEWAY_MASTER_ADMIN_KEY: "${GATEWAY_MASTER_ADMIN_KEY:-sk-gw-master-admin-default-key-change-me}"
      GATEWAY_MASTER_ENCRYPTION_KEY: "${GATEWAY_MASTER_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}"
    depends_on:
      gateway-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
