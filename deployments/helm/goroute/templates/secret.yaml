{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "goroute.secretName" . }}
  labels:
    {{- include "goroute.labels" . | nindent 4 }}
type: Opaque
stringData:
  GATEWAY_POSTGRES_DSN: {{ .Values.secrets.postgresDSN | quote }}
  GATEWAY_MASTER_ADMIN_KEY: {{ .Values.secrets.masterAdminKey | quote }}
  GATEWAY_MASTER_ENCRYPTION_KEY: {{ .Values.secrets.masterEncryptionKey | quote }}
  {{- if .Values.secrets.sessionSecret }}
  GATEWAY_SESSION_SECRET: {{ .Values.secrets.sessionSecret | quote }}
  {{- end }}
  {{- if .Values.secrets.redisPassword }}
  GATEWAY_REDIS_PASS: {{ .Values.secrets.redisPassword | quote }}
  {{- end }}
  {{- range $key, $val := .Values.secrets.extraSecrets }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
{{- end }}
