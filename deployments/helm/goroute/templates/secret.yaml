{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "goroute.secretName" . }}
  labels:
    {{- include "goroute.labels" . | nindent 4 }}
type: Opaque
stringData:
  GATEWAY_POSTGRES_DSN: {{ required "secrets.postgresDSN is required when secrets.create=true (or provide secrets.existingSecret)" .Values.secrets.postgresDSN | quote }}
  GATEWAY_MASTER_ADMIN_KEY: {{ required "secrets.masterAdminKey is required when secrets.create=true (or provide secrets.existingSecret)" .Values.secrets.masterAdminKey | quote }}
  GATEWAY_MASTER_ENCRYPTION_KEY: {{ required "secrets.masterEncryptionKey is required when secrets.create=true (or provide secrets.existingSecret)" .Values.secrets.masterEncryptionKey | quote }}
  {{- if .Values.secrets.jwtSecret }}
  GATEWAY_JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  {{- end }}
  {{- if .Values.secrets.sessionSecret }}
  GATEWAY_SESSION_SECRET: {{ .Values.secrets.sessionSecret | quote }}
  {{- end }}
  {{- if .Values.secrets.redisPassword }}
  GATEWAY_REDIS_PASSWORD: {{ .Values.secrets.redisPassword | quote }}
  {{- end }}
{{- end }}
