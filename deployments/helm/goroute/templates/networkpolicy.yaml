{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "goroute.fullname" . }}
  labels:
    {{- include "goroute.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "goroute.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
        {{- if gt (int .Values.service.grpcPort) 0 }}
        - protocol: TCP
          port: {{ .Values.service.grpcPort }}
        {{- end }}
      {{- with .Values.networkPolicy.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
        - protocol: TCP
          port: {{ .Values.networkPolicy.egressPorts.postgres }}
        - protocol: TCP
          port: {{ .Values.networkPolicy.egressPorts.redis }}
        - protocol: TCP
          port: {{ .Values.networkPolicy.egressPorts.https }}
{{- end }}
