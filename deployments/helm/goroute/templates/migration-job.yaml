{{- if .Values.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "goroute.fullname" . }}-migrate
  labels:
    {{- include "goroute.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "goroute.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: OnFailure
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.migration.image.repository }}:{{ .Values.migration.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.migration.image.pullPolicy }}
          command:
            {{- if and .Values.config (not .Values.migration.command) }}
            - "/app/ai-gateway"
            - "-config"
            - "/etc/goroute/config.yaml"
            - "-migrate-only"
            {{- else }}
            {{- toYaml .Values.migration.command | nindent 12 }}
            {{- end }}
          env:
            {{- range $key, $val := .Values.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "goroute.secretName" . }}
          resources:
            {{- toYaml .Values.migration.resources | nindent 12 }}
          {{- if .Values.config }}
          volumeMounts:
            - name: gateway-config
              mountPath: /etc/goroute
              readOnly: true
          {{- end }}
      {{- if .Values.config }}
      volumes:
        - name: gateway-config
          configMap:
            name: {{ include "goroute.fullname" . }}-config
      {{- end }}
{{- end }}
