apiVersion: v1
kind: Service
metadata:
  name: {{ include "goroute.fullname" . }}
  labels:
    {{- include "goroute.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
    {{- if gt (int .Values.service.grpcPort) 0 }}
    - name: grpc
      port: {{ .Values.service.grpcPort }}
      targetPort: grpc
      protocol: TCP
    {{- end }}
  selector:
    {{- include "goroute.selectorLabels" . | nindent 4 }}
