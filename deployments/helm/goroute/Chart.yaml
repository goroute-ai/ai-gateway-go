apiVersion: v2
name: goroute
description: Production Helm chart for GoRoute AI Gateway
type: application
version: 0.1.0
appVersion: "1.6.0"
keywords:
  - ai-gateway
  - llm
  - mcp
  - a2a
  - goroute
maintainers:
  - name: GoRoute Maintainers
dependencies:
  - name: postgresql
    version: "16.x.x"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled
  - name: redis
    version: "20.x.x"
    repository: "https://charts.bitnami.com/bitnami"
    condition: redis.enabled
