events {
  worker_connections 1024;
}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream goroute_backend {
    least_conn;
    server ai-gateway-1:8080 max_fails=2 fail_timeout=5s;
    server ai-gateway-2:8080 max_fails=2 fail_timeout=5s;
    keepalive 64;
  }

  # HTTPS TLS Edge (:8443)
  server {
    listen 8443 ssl;
    server_name localhost nginx-lb;

    ssl_certificate     /etc/nginx/tls/nginx-lb.crt;
    ssl_certificate_key /etc/nginx/tls/nginx-lb.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 25m;

    location / {
      proxy_pass http://goroute_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Request-Id $http_x_request_id;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
      proxy_next_upstream error timeout http_502 http_503;
      proxy_next_upstream_tries 2;
    }
  }

  # Plain HTTP Edge (:8080) for internal k6 / non-TLS smoke checks
  server {
    listen 8080;
    server_name localhost nginx-lb;

    client_max_body_size 25m;

    location / {
      proxy_pass http://goroute_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto http;
      proxy_set_header X-Request-Id $http_x_request_id;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
      proxy_next_upstream error timeout http_502 http_503;
      proxy_next_upstream_tries 2;
    }
  }
}
